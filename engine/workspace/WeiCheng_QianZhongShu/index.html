 "frame": {\r
  "levelIntro": {\r
   "1": [\r
    {\r
     "kind": "narration",\r
     "text": "第一卷 · 归航"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "一只老式的自鸣钟，挂在空房间的墙上。它走得很慢，每过一个钟头，都要比世上的钟慢去几分。没有人听它，它自顾自地、一下一下地数着时间。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "这个故事，要从一九三七年的夏天讲起。那一年，卢沟桥的枪声刚响，战事眼看要烧起来；可在一艘开往中国的法国邮船上，红海的热浪里，一群人还浑然不觉。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "三等舱的甲板上挤满了人：法国人、流亡出来的犹太人、印度人、安南人，还有十几个学成回国的中国留学生。不知哪里来了两副麻将牌，除掉吃饭睡觉，他们成天赌钱消遣。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "这群人里有个叫方鸿渐的年轻人，坐着二等舱。他在欧洲晃了四年，伦敦、巴黎、柏林都住过，兴趣颇广，心得全无。此刻他口袋里揣着一张博士文凭——那是他花三十美金，从一个爱尔兰骗子手里买来的。他还不知道，这张纸会在往后两年里，一次又一次地出卖他。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "甲板的另一头，一位戴太阳眼镜的女博士摊着一本书，眼光却越过书页，落在这个无所事事的同乡身上。船还早，日子还长，海风里已经含着燥热，像有什么事要发生。"\r
    }\r
   ],\r
   "2": [\r
    {\r
     "kind": "narration",\r
     "text": "第二卷 · 沪上情场"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "方鸿渐回到上海，住进挂名岳父的家里，在银行领一份不做事的薪水。战事把家乡搅得天翻地覆，他逃难回沪，日子过得像一杯温吞的茶。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "那一年的春天来得特别好。逃难里死的人太多了，枉死者没消磨掉的生命力，都迸作春天的生意，鼓动得人心发痒。方鸿渐白天昏昏想睡，晚上倒又清醒，总觉得少了点什么。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "现成的女朋友太缺乏了。他想起船上那位女博士苏文纨，想起她替他洗过的手帕、钉过的钮扣，便往苏家花园走去——明知也许从此多事，可是生活太无聊了。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "在苏家的客堂里，他遇见两个人。一个是苏文纨的表妹唐晓芙，不烫头，不擦口红，笑起来两个浅酒涡——那是摩登文明社会里的一桩罕物，一个真正的女孩子。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "另一个叫赵辛楣，苏文纨的青梅竹马，身材高大，神气轩昂，把方鸿渐从头到脚打量了一遍，像看一页一览而尽的幼稚园读本。一场三个人的战争，就这样开了场。"\r
    }\r
   ],\r
   "3": [\r
    {\r
     "kind": "narration",\r
     "text": "第三卷 · 西行记"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "失恋接着失业。方鸿渐被挂名岳父家客客气气地请了出来，像在外面挨了打的狗，夹着尾巴窜回父母家。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "这时候，赵辛楣找上门来。苏文纨嫁了别人，两个情场败将一见面，倒成了同病相怜的朋友。赵辛楣给他指了一条路：湖南平成，一所新办的国立三闾大学，正缺教书的人。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "同路的有五个人。除了赵辛楣和方鸿渐，还有中国文学系主任李梅亭——他拖着一只一人高的大铁箱，谁也不许碰；历史系副教授顾尔谦，见谁都堆着笑；还有一个刚毕业的女学生孙柔嘉，赵辛楣世交的女儿，怯生生的，一句话也不敢讲。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "从上海到平成，要换船、换车、换轿，走上一个多月。战时的路，车票要靠抢，汇款要靠保，旅店里有跳蚤，山路旁是坟场。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "有人说，旅行是最劳顿、最麻烦、叫人本相毕现的时候。这五个人结伴上路，谁也没料到，这一路的困顿，会把每个人心底的那点东西，一样一样逼出来。"\r
    }\r
   ],\r
   "4": [\r
    {\r
     "kind": "narration",\r
     "text": "第四卷 · 三闾大学"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "三闾大学设在平成县乡下的一座财主花园里，面溪背山。校长高松年是位研究昆虫的老科学家，逢人便讲：学校也是个有机体，教职员之于学校，应当像细胞之于有机体。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "新学校，新官场。教授名单里全是算盘：中国文学系主任的位子，高校长先许了李梅亭，又给了部里汪次长的伯父汪处厚；历史系主任韩学愈，据说也是美国克莱登大学的博士，还娶了一位美国太太。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "方鸿渐一到校就挨了当头一棒：电报上明明写着教授，到了校长室，却成了副教授。高校长说，他写过一封解释的信——只怪抗战时期的邮政，简直该死。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "降职、代课、学生的哄笑、同事的眼色，一样一样磨人。可方鸿渐渐渐发现，这所学校里的每一个人，都揣着一本不肯示人的账。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "有人说过，婚姻像一座围城。其实学校又何尝不是——外面的人想挤进来，里面的人，各有各的想逃。"\r
    }\r
   ],\r
   "5": [\r
    {\r
     "kind": "narration",\r
     "text": "第五卷 · 围城"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "学期结束，全校的聘约都发了，连韩学愈的洋太太都在续聘之列，独独没有方鸿渐。他成了伊索寓言里那只没尾巴的狐狸。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "离开三闾那天，没有一个同事替他饯行。倒是孙柔嘉，一路陪着他。这两个在困顿里走近的人，经桂林，飞香港，要去见双方的父母了。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "在香港，赵辛楣劝他：赶快用最简单的手续结婚。这位老朋友还意味深长地说了一句——孙小姐这人，煞费苦心。方鸿渐没听进去。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "注册、照相、成婚，快得像一阵风。也是在香港，他重逢了苏文纨——当年的女博士，如今是又时髦又阔气的曹太太。她当着众人的面，轻轻巧巧地羞辱了他的新娘。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "回到上海，两个家庭坐到了一张桌上。方家嫌孙家简慢，孙家嫌方家陈腐。城外的人冲进去了。城里的日子，才刚刚开始。"\r
    }\r
   ]\r
  },\r
  "ending": {\r
   "title": "尾声 · 六点钟",\r
   "segments": [\r
    {\r
     "kind": "narration",\r
     "text": "冬至过后没几天，那个家就散了。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "那天夜里，方鸿渐推开家门，破杯子和断成两截的象牙梳子还在原处，成堆的箱子少了一只。柔嘉带着李妈，去了姑母家。桌上留着一张名片，他把它撕得粉碎。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "这场婚姻，从三闾大学的一阵谣言起，到香港的一张注册纸，再到上海的两间小房，不过一年光景。两个家庭互相瞧不上：方家嫌孙家简慢，孙家嫌方家陈腐；夹在最中间的两个人，把从父母、姑母、妯娌那里受的气，一样一样撒在彼此身上。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "其实没有谁是完全的坏人。方遯翁的迂腐里藏着体面，柔嘉的算计里藏着无依，李妈的偏心是她一辈子吃过的亏，就连那只哈巴狗，也只是替主人看人脸色。可这些不算坏的人凑在一起，日子就过成了一地鸡毛。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "许多年前那场酒宴上，有人说过：结婚像一座被围困的城堡，城外的人想冲进去，城里的人想逃出来。方鸿渐冲过了学业、冲过了爱情、冲过了婚姻，一进城，又想逃了。其实何止婚姻——留学、归国、教书、成家，他这一辈子，都在进城与出城之间来回。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "他决定去重庆，投奔那个一路提拔他的老朋友。船票还没有买，旅费还没有着落，可心里又生出一点希望，像湿柴虽点不着火，而开始冒烟，似乎一切会有办法。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "那只祖传的老钟从容自在地打起来，仿佛积蓄了半天的时间，等夜深人静，搬出来一一细数：当、当、当、当、当、当，响了六下。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "六点钟，是五个钟头以前。那时候，他在回家的路上走，蓄心要待她好；那时候，她在家里等他回来吃晚饭。两个好意错开了五个钟头，就再也对不上了。这个时间落伍的计时机，无意中包涵了对人生的讽刺和感伤，深于一切语言、一切啼笑。"\r
    }\r
   ],\r

   "segments": [\r
    {\r
     "kind": "narration",\r
     "text": "一九三七年七月，三伏天。一艘法国邮船切开印度洋的热浪，慢慢向中国开。三等舱的甲板上没有风，只有汗味、烟味，和餐室窗口传出来的麻将牌响。{{e_fanghongjian|方鸿渐}}倚着栏杆看海——留学生们都在餐室里赌钱，他一个人站在这里，倒显得不合群。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "餐室里其实没几个人真在看牌。男学生们的眼睛一半在牌上，一半在等一个人。输急了的人骂牌，骂得比输赢凶得多。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "躺椅上，{{e_suwenwan|苏文纨}}戴一副太阳眼镜，捧一本书，半天不翻一页。带着孩子看热闹的{{e_suntaitai|孙太太}}，眼睛比谁都忙：孩子的皮带拴在她手里，她的舌头谁也拴不住。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "[[NPC1]]从餐室里出来了。中葡混血，皮肤是结实的蜜色，绯霞色抹胸，海蓝色贴肉短裤，十个指甲涂得通红。她一走动，满甲板的目光都跟着走。男学生背后叫她“熟食铺子”，文雅一点的叫她“真理”——真理据说是赤裸裸的；再考究一点的，只好承认这是“{{e_jubuzhenli|局部的真理}}”。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（径直走到栏杆边，挨住他）方先生，借个火。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "海风大，火柴划了三根才着。她俯下身凑那点火，两只手拢着他的手，两个人头碰着头。烟点着了，她的嘴唇也碰到了他的。他握着燃剩的火柴愣在那里，烧痛了手指才丢开。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（吐出一口烟，笑）方先生，你教我想起了我的 fiance——你相貌和他像极了！"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "这话她说得又轻又快，像随口恭维，又像认真。他在欧洲听过各种恭维，独这一句，听进了心里。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "她在前方口岸有个未婚夫{{e_liyisheng|李医生}}，出钱供她到伦敦学医。这事全船都知道，全船也都装作不知道。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "餐室里的麻将声停了一停，又响起来。没人留意甲板，除了那几双闲着的眼睛。"\r

     "speakerEntry": "e_suntaitai",\r

     "speakerEntry": "e_suntaitai",\r
     "text": "（撇嘴）有未婚夫还那样浪漫麽？"\r

     "text": "忠厚老实人的恶毒，像饭里的砂砾或者出骨鱼片里未净的刺，会给人一种不期待的伤痛。躺椅上的书又翻过一页。那一页写的是什么，看书的人自己也不知道。"\r

     "kind": "monologue",\r
     "slot": "NPC1",\r
     "text": "我父亲{{e_fangdunweng|方遯翁}}是江南小县的前清举人，本乡的大绅士。高中时家里就给我订了亲。大学时读了几本闲书，忽然想通了：世间哪有恋爱？压根儿是生殖冲动。于是写信回家文绉绉地说自己“每揽镜自照，神寒形削，清癯非寿者相”，求父亲退婚。"\r
    },\r
    {\r
     "kind": "monologue",\r
     "slot": "NPC1",\r
     "text": "父亲的回信把我骂得抬不起头：“汝托词悲秋，吾知汝实为怀春。”末了一句最实在——若执迷不悔，吾将停止寄款。我立刻老实了。谁料大四那年，未婚妻害伤寒死了。我写了篇辞气凄婉的唁信，岳父{{e_zhoujingli|周经理}}读了直掉泪，说这孩子是情种。他是银行经理，有钱也要体面，一出手两万块送我去欧洲留学。"\r
    },\r
    {\r
     "kind": "monologue",\r
     "slot": "NPC1",\r
     "text": "欧洲四年换了三个大学：伦敦、巴黎、柏林。兴趣颇广，心得全无。最后一年，父亲和岳父同时来信：学位呢？我从旧杂志翻到一则广告——美国{{e_kelaideng|克莱登大学}}，函授，不用上课。我同纽约一个爱尔兰人通信半年，寄去三十美金，换回一张{{e_wenping|克莱登大学文凭}}：哲学博士。"\r
    },\r
    {\r
     "kind": "monologue",\r
     "slot": "NPC1",\r
     "text": "这一张文凭，仿佛有亚当、夏娃下身那片树叶的功用，可以遮羞包丑。我还回信戏弄那爱尔兰人，说文凭印刷太糙，不像名牌学府的手笔。这事也许是中国自有外交或订商约以来唯一的胜利。"\r

     "kind": "monologue",\r
     "slot": "NPC1",\r
     "text": "柏拉图《理想国》里说过，兵士对敌人、医生对病人、官吏对民众，都应当哄骗。可见撒谎欺骗，有时并非不道德。我把文凭收进箱子，心安理得上了回国的船。"\r
    }\r

     "kind": "monologue",\r

     "text": "船上的人背后叫我“女博士”。里昂大学的法国文学博士，论文写的是《中国十八家白话诗人》。这顶帽子戴上就摘不下来——身为女博士，反觉得崇高的孤独，没有人敢攀上来。男学生们见了我先矮半截，连请我让路都先说“对不起”。"\r
    },\r
    {\r
     "kind": "monologue",\r
     "slot": "NPC1",\r
     "text": "我原把自己的爱情看得太名贵，不肯随便施予。好像做了好衣服舍不得穿，锁在箱里；过一两年忽然发见，这衣服的样式和花色都不时髦了。所以这条船上，我不能再袖手看下去了。再袖手下去，我就成了那件锁在箱里的衣服。"\r

     "text": "可是半个月来，他天天跟{{e_baoxiaojie|鲍小姐}}混在一起——那种女人，中葡混血，穿成那个样子满船跑，岸上早有个未婚夫等着她。他竟看不出，人家是拿他消遣。"\r

     "kind": "monologue",\r
     "slot": "NPC1",\r
     "text": "前天甲板上点烟那一幕，全船都看见了。那位带孩子的太太嚼舌头，说他们船一靠岸就会订婚。订婚？我听着只觉得可笑。男人的这点糊涂，正是女人的机会。"\r

   "segments": [\r
    {\r
     "kind": "narration",\r
     "text": "{{e_lunchuan|白拉日隆子爵号}}在一个法属殖民地的港口泊两夜。岸上是椰子树、法文招牌，和湿得能拧出水的夜。头一夜出了什么事，只有甲板知道。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "当夜她摸进他的房舱，天亮前又溜回去。[[NPC1]]从{{e_fanghongjian|方鸿渐}}的房舱里出来时，晨雾还没散，她自以为神不知鬼不觉。三只{{e_fachai|发钗}}，落在了他的枕边。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "上午，茶房[[NPC2]]来收拾床铺。他捏着那三只发钗，堵在门口不走，广东官话拖泥带水。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC2",\r
     "text": "（把发钗摊在手心）方先生，这是我刚才铺你的床捡到的。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC2",\r
     "text": "（见他不作声，又补一句）方先生是体面人。这东西叫别人捡到，大家不好看。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "话说到这个地步，价钱就好谈了。他要三百法郎，还说这是看在方先生平时的面子上。三百法郎，买回三只发钗，也买回一夜的安静。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（正好进门，一把抓过发钗）谁还要这东西！经过了那家伙的脏手！"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "发钗扔进了海里。茶房[[NPC2]]捏着钱鞠躬，倒退着出去，眼睛里的意思却一点没少。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "门关上以后，屋里静得可怕。她坐在床沿，半天没说话。她心疼的不是发钗——是把柄从此攥在别人手里，那个人的嘴，谁知道值几个三百法郎。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "上岸吃西餐。馆子是洋人开的，窗外的太阳白辣辣的，牛排老得像皮带，汤是温吞的，面包硬得能敲钉子。不知是菜气人，还是那三百法郎气人，两人吃着吃着就顶撞起来。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "speakerEntry": "e_fanghongjian",\r
     "text": "（放下刀叉）信基督教的人，怎样做医生？医药无效，逃不了一死，就找牧师和神父来送终——这仿佛药房掌柜带开棺材铺子。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（动了真气）你只靠一张油嘴，胡说八道！我也是学医的，你凭空为什么损人？"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "speakerEntry": "e_fanghongjian",\r
     "text": "（还笑）我说的是教，又不是医，你急什么？"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "他想哄她，“黑甜”“朱古力小姐”叫出口，她的脸更黑了。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（霍地站起来）我就那样黑麽？"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "这一顿饭，吃掉了三百法郎，也吃掉了甲板上的那点热乎气。回船以后，她见了他，话一天比一天少。甲板上再碰见，她只点个头，眼睛望着海，倒像那一夜是别人做的梦。"\r
    }\r
   ],\r

   "segments": [\r
    {\r
     "kind": "narration",\r
     "text": "船泊进热带港口的第一夜。岸上潮湿闷热，甲板反倒凉快，风里有椰子油的味道。{{e_fanghongjian|方鸿渐}}和[[NPC1]]并肩散步，皮鞋跟敲着铁板，一圈，又一圈。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（忽然站定）方先生，你陪我走了三圈了，累不累？"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "speakerEntry": "e_fanghongjian",\r
     "text": "不累。海上走了半个月，就今晚这段路最短。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（笑出声）你这张嘴，在岸上也是这么哄女人的？"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "speakerEntry": "e_fanghongjian",\r
     "text": "岸上我没有熟人。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（眼睛一亮）没有熟人好。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "她说这话的时候，眼睛在他脸上停了一停，像在点货。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "那位女博士，是你的老同学罢？她看你的眼神，像先生看学生。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "speakerEntry": "e_fanghongjian",\r
     "text": "她看谁都是那个眼神。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（哼了一声）她看我，就像看一件行李。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "speakerEntry": "e_fanghongjian",\r
     "text": "你那位未婚夫，在岸上等你？"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（把烟头弹进海里）等他的是他，等你的也是我吗？方先生，男人问这种话，最扫兴。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "她说话带一点南洋腔，软软的，字句却像小刀子，递过来不由你不接。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "我学医的，方先生。医书上讲，心跳快，是病。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "speakerEntry": "e_fanghongjian",\r
     "text": "那我现在跳得很快。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（咯咯笑）那就该治。可惜船上没有医生，只有一个学医的我。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "第三圈走完，风大了。她把他的胳膊拉过来挽着，像挽一件自己的东西。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "明晚上岸，你请我吃饭。吃好的，不许省钱。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "speakerEntry": "e_fanghongjian",\r
     "text": "请你吃饭是我的福气，省钱是餐馆的厚道。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "走到没有灯的船尾，她忽然站住，转过身来看他。月光落在她脸上，一半明，一半暗。他还没想好要不要退，她已经凑上来，抢了一个吻。他还没回过神，她已经退开半步。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（喘着气，笑）我给你闷死了！……太便宜你，你还没求我爱你！"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "speakerEntry": "e_fanghongjian",\r
     "text": "（定了定神）那我现在求，来得及来不及？"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "她不答，望着岸上远远的灯，烟头在指间一明一灭。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（好像不经意地）咱们俩今天都是一个人睡。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "说完她就走了，鞋跟声一路敲回灯亮的地方。他一个人在船尾站了很久，把这句话翻过来、倒过去地想。海上的夜那么长，长得像专门给人留的。他回房舱，对着镜子看了看自己——这张脸，今晚总算派了点用场。那一夜他睡得很迟，梦里全是鞋跟敲铁板的声音，一圈，又一圈。"\r
    }\r

   "segments": [\r
    {\r
     "kind": "narration",\r
     "text": "船靠上回国后的第一个大码头。天没亮透，舢板已经围上来，卖水果的、换钱的、揽行李的，叫声一片。挑夫涌上甲板，接客的人挤在栅栏外，牌子举得比头高。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "靠岸前这几天，[[NPC2]]早变了脸。她跟{{e_suwenwan|苏文纨}}忽然亲热起来，勾着手寸步不离，吃饭同一张桌，散步同一个方向，倒像十几年的姊妹。{{e_fanghongjian|方鸿渐}}凑上去说话，她客客气气地挡回来。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC2",\r
     "text": "（笑笑，很客气）谢谢你！不用劳你驾，我有人会上船来接我。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "客气是最远的一种距离。他这才明白，前些日子那些不客气，原来是有时效的。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "汽笛一响，乘客往下走。[[NPC2]]忽然撇下女伴，提着裙子跑下跳板，一路跑进栅栏，扑进一个男人怀里。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "那个男人[[NPC1]]，半秃顶，戴一副大眼镜，是个黑胖子，年纪比她大出一截。他把她抱起来转了半圈，眼镜滑到鼻尖。两个人当众咬耳朵，笑得旁若无人。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（搂着她，声音洪亮）想死我了！在船上乖不乖？有没有想我？"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC2",\r
     "text": "（撒娇，声音大得故意让人听见）你猜！"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "汽车喇叭响了两声。她挽着那男人的胳膊上车，一路叽叽喳喳，手在空气里比划，又快又急，像船上的日子急着要讲完，又急着要忘掉。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "方鸿渐站在甲板上，从头看到尾。他这才想起她说过的那句话——你相貌和我的未婚夫像极了。原来那不是情话，是广告：先告诉你货色一样，再告诉你此款不售。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "他把这一路的账在心里算了一遍：{{e_xigong|西贡}}那两夜是一笔，点烟是一次，发钗是一次，三百法郎是一次。次次都是他掏钱掏心，人家记账。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "speakerEntry": "e_suwenwan",\r
     "text": "（不知什么时候站到他旁边，柔声）方先生不下船，在想心思？人家撇了方先生去啦！没人陪啦。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "他没有回头。女人是最可怕的！这话他此刻才算真懂——人家从头到尾没骗过他一个字，是他自己把广告当成了情书。海风一吹，情书和广告都散了。"\r
    },\r

    }\r

   "cg": "wc-assets/cg/c1_07.jpg",\r
   "cgPrompt": "Bright Kyoto-animation style anime, 1930s: bright sea day on a liner deck, a composed young woman sewing a button onto a young man's shirt cuff as he sits stiffly in a deck chair, needle and thread glinting; gentle but inescapable intimacy, crisp sunlight, close-up on hands, no text.",\r

   "segments": [\r
    {\r
     "kind": "narration",\r
     "text": "船离了{{e_xianggangmatou|香港码头}}五六天。海还是那片海，船上的人心却换了几轮。{{e_fanghongjian|方鸿渐}}懒洋洋躺在甲板椅上晒太阳，[[NPC1]]走了过来。这些日子她来得勤了，今天一本书，明天一杯茶，总要在他旁边坐下来。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（皱着眉，在他旁边站定）啊哟！你的手帕怎么那么脏！这样的男人，真亏你有脸走出来。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "speakerEntry": "e_fanghongjian",\r
     "text": "（摸出手帕看了看）还好罢，不过用了两三天。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（劈手夺过去）还好？拿我的去。拿去，别推，我最不喜欢推。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "他手里多出一块干净的{{e_shoupa|手帕}}，带一点淡淡的香水味。她做事向来这样：先宣布，后动手，不许商量。推是推不掉的——她说不喜欢推，就是不许推。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "第二天，她又发现他的衬衫少了一粒钮扣。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（拿出针线包，不由分说）你这人怎么邋遢到这个地步。坐好，别动。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "speakerEntry": "e_fanghongjian",\r
     "text": "这怎么敢当，我自己会钉。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（低头穿针）你会？你会就不会让它缺到今天。别动。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "她钉得很专心，头发垂下来，扫着他的手背。他僵在椅子上，动也不是，不动也不是。旁边几个学生朝这边看，她看见了，也不躲，倒像特意要做给人看。"\r

     "text": "周末下午，花园洋房的客厅又开茶会。女主人 [[NPC1]] 坐在沙发正中，像坐镇中军帐。今天的客人：{{e_fanghongjian|方鸿渐}}、{{e_zhaoxinmei|赵辛楣}}，还有刚从法国回来的沈先生、{{e_shentaitai|沈太太}}夫妇。女主人的表妹{{e_tangxiaofu|唐晓芙}}今天从{{e_tangjia|唐家}}过来，坐在角落里，捧着茶听。"\r

     "text": "沈先生分析国际形势，从欧洲讲到远东，结论是仗打不大。赵辛楣衔着烟斗，哼了一声。"\r

    },\r
    {\r
     "kind": "dialogue",\r
     "speakerEntry": "e_fanghongjian",\r

    },\r
    {\r
     "kind": "narration",\r
     "text": "满座笑了。沈太太也笑，笑得很法国。女主人眼波一转，又给赵辛楣递了块点心。"\r

     "slot": "NPC1",\r
     "text": "对了，听说{{e_emei|峨嵋春}}的川菜最地道。哪天你们谁做东？"\r

     "text": "川菜馆子里，红油翻滚，满屋麻辣香。{{e_fanghongjian|方鸿渐}} 订了一桌菜，请的是表姐妹两位。等到上菜时分，堂倌跑来传话：{{e_suwenwan|苏文纨}} 来了电话。"\r

    {\r
     "kind": "narration",\r
     "text": "方鸿渐大笑。笑完了，给她布菜。她也不客气，照单全收。第三道菜上完，电话又来了。这回她不去接。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "让它响去。（对方鸿渐）我最恨电话。电话是偷懒人的拜访，吝啬人的通信。最不够朋友！"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "这话方鸿渐头一回听见，觉得新鲜。{{e_dianhua|电话与信}}，这里头原来还有讲究。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "一个人的声音，往往在电话里变得认不出，变得难听。要说话，当面说；见不着，就写信。信上有字迹，有语气，拆信的时候还有一点心跳。电话有什么？叮铃铃，催命一样。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "speakerEntry": "e_fanghongjian",\r
     "text": "照你这么说，我以后决不跟你通电话。我最恨朋友间通电话，宁可写信。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "写信？（笑）你会写么？"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "speakerEntry": "e_fanghongjian",\r
     "text": "不会写也写。不过你得先告诉我地址。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "她也不推辞，说了住址，又说了门牌。方鸿渐没带纸笔，掏出随身带的一本书，把地址端端正正写在后头的空页上。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（看他写）写好了？可别弄丢。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "speakerEntry": "e_fanghongjian",\r
     "text": "丢不了。这本书，以后就是我的户口簿。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "那顿饭吃到馆子打烊。出门时天真落了雨，两人叫车，一个向东，一个向西。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（上车前）女人不傻，决不因为男人浪费摆阔而对他有好印象——可是，你放心，女人全是傻的，恰好是男人所希望的那样傻，不多不少。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "车走了。方鸿渐坐在车里，闻着袖口上沾的麻辣味，把那句话琢磨了一路，也没琢磨透自己该算哪一种男人。他只知道，这顿饭是他回国以来吃得最值的一顿。"\r
    }\r
   ],\r

   "cgPrompt": "Bright anime style, 16:9. A book-lined study in a 1930s Shanghai lawyer's home, law books and two teacups on a desk; a young man in a loose suit gestures animatedly while a girl with a round face sits silhouetted against bright window light, playful mood. No text in image.",\r

   "segments": [\r
    {\r
     "kind": "narration",\r
     "text": "律师人家的书房，四壁是书，法律书居多，也夹着小说和诗集。{{e_fanghongjian|方鸿渐}} 得了地址，第一次登门。[[NPC1]] 把他让进书房，泡了两杯茶。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "我父亲的房间，他下午出庭去了。你随便坐，别装得跟客人似的。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "speakerEntry": "e_fanghongjian",\r
     "text": "我本来就是客人。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "客人没有第二次上门的。（笑）坐。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "两人从那顿川菜说起，说到学校，说到留学。方鸿渐在外国四年，换了三个大学，说起来全无得意之色。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "speakerEntry": "e_fanghongjian",\r
     "text": "我在外国四年，伦敦、巴黎、柏林，兴趣颇广，心得全无。人家问我留了什么学，我说留了张皮。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "speakerEntry": "e_fanghongjian",\r
     "text": "我父亲{{e_fangdunweng|方遯翁}}常说，读书人不出洋，好比玉不琢，不成器。他老人家是前清举人，把出洋当中举，指望我衣锦还乡。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "那你衣锦还乡了没有？"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "speakerEntry": "e_fanghongjian",\r
     "text": "还乡了，锦没还。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "你倒坦白。我们学校里，留过学的先生，开口闭口『我在剑桥的时候』『我在哈佛的时候』，恨不得把校徽缝在额头上。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "这年头留洋成了风气，好像不出一趟洋，人就矮半截——{{e_chuyang|出洋如出痘}}，这话一点不假。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "我表姐身边，如今就有一位剑桥回来的新诗人，{{e_caoyuanlang|曹元朗}}。脸圆圆的，像庙里的大阿福，人很和气，就是诗念不懂。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "speakerEntry": "e_fanghongjian",\r
     "text": "诗要人念得懂，还叫新诗么？"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "他念过几首，我一句没记住。我只觉得，好好的中国话，到他嘴里就分了家，东一个字，西一个字，谁也不认得谁。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "speakerEntry": "e_fanghongjian",\r
     "text": "高见。你这评论，比他的诗还像诗。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "少拍马屁。（笑）我表姐倒很赏识他，说他有天才。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "方鸿渐听了，心里莫名其妙地一沉，随即又觉得自己可笑——人家赏识谁，关他什么事。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（看他）你怎么不说话了？"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "speakerEntry": "e_fanghongjian",\r
     "text": "我在想，天才这东西，跟伤风一样，人人都免不了害一回。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "又贫。（起身续茶）下回来，带两封你写的信给我看看——你说宁可写信的，我倒要瞧瞧你的文笔。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "speakerEntry": "e_fanghongjian",\r
     "text": "文笔不好，诚意来凑。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "那天他告辞时，天擦黑。她送到门口，酒涡在暮色里一闪。方鸿渐走了一路，把『诚意』两个字想了一路。"\r
    }\r

    {\r
     "kind": "narration",\r
     "text": "花园洋房的客厅里，今天格外热闹。女主人 [[NPC2]] 请来一位贵客：剑桥回来的新诗人 [[NPC4]]，滚圆的脸，一团和气，见人就鞠躬，像庙里的大阿福。报馆那位衔烟斗的大编辑 {{e_zhaoxinmei|赵辛楣}} 今天缺席——他若在，这场诗会怕要变成战场。[[NPC1]] 和表妹 [[NPC3]] 也在座。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "新诗人带来他的新作，一部诗集，名叫 {{e_pinpan|《拼盘姘伴》}}。他站起身，清清嗓子，亲自朗诵。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC4",\r
     "text": "这集子里的诗，都是在剑桥的灯下写的。题目印在封面上，诸位自己看——好诗是不用讲的。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC4",\r
     "text": "（朗诵）孕妇的肚子颤巍巍贴在天上……Wir sind！Wir sind！"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "满座屏息。诗里东一个字，西一个字，中国字夹着外国字，谁也不认得谁。念完了，他鞠个躬，脸更圆了。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC4",\r
     "text": "诸位不要问我什么意思。诗有意义是诗的不幸！"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "女主人带头鼓掌。表妹低着头，肩膀一耸一耸，不知是感动还是忍笑。[[NPC1]] 跟着拍了两下手，心里佩服：能把不懂说得这么理直气壮，也是本事。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC2",\r
     "text": "好诗。（摇着檀香扇）我也有一件东西，请诸位品题。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "她取出一把 {{e_zheshan|折扇}}，徐徐展开。扇面上一首情诗，字迹秀挺，落款是青年政客王尔恺。这位王尔恺，报上常见他的名字，听说正要外放做官，是场面上的人物。诗写的是——"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "『难道我监禁你？还是你霸占我？你闯进我的心，关上门又扭上锁……从此无法开门，永远，你关在我心里。』"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC2",\r
     "text": "王尔恺先生题的。诸位看，这诗做得怎样？"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "满座传看，都说好。新诗人说有古典的温存。扇子传到 [[NPC1]] 手里，他看了两遍，越看越眼熟——这句子，他在柏林的旧书里见过，是德国十五六世纪的民歌，翻成中文，换了件长袍马褂。他本想忍住，话到嘴边，像鱼刺卡在喉咙里，不吐不快。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（脱口而出）不得了！这首诗是偷来的。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "满座一静。檀香扇停了。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC3",\r
     "text": "（低声）完了，你闯祸了。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（低声）我这嘴，比脑子快。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC2",\r
     "text": "（笑，笑得有点僵）你说什么？"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "至少是借的，借的外债。这诗的本家在德国，十五六世纪的民歌，我在外国念书时读过。王尔恺先生……手笔未免太便宜了。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "话说出口，他才觉出不对。女主人的脸白了一层，又慢慢红回来，笑得比刚才更客气。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC2",\r
     "text": "博士好渊博的学问。一把扇子，也劳动你考据。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC4",\r
     "text": "（打圆场）民歌好，好诗都有民歌的血统。这不算偷，这算……借鉴。"\r
    },\r

     "kind": "narration",\r
     "text": "表妹 [[NPC3]] 坐在角落，看看这个，看看那个，酒涡里盛着笑，又不敢笑出来。那天散场，女主人送客只送到客厅门口，没有再往外送。[[NPC1]] 走在梧桐树下，后知后觉地出了一身冷汗：他好像闯了祸，又说不清闯的是什么祸。"\r
    }\r

   "segments": [\r
    {\r
     "kind": "narration",\r
     "text": "折扇风波之后，{{e_fanghongjian|方鸿渐}} 心里不安，写了一封文言信去请罪，字斟句酌，酸得倒牙。信去了两天，回信没等到，他索性打听得地址，登门到律师家来探口风。[[NPC1]] 在书房里见他，一见就笑，笑得他心里发毛。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "请罪信我们看到了。之乎者也，好大的学问。（学他）『不揣冒昧，妄加评骘』——你肉麻不肉麻？"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "speakerEntry": "e_fanghongjian",\r
     "text": "我是真心赔罪。那天我多嘴，闯了祸。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "闯祸？（笑出声）你知道那首诗是谁做的？"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "speakerEntry": "e_fanghongjian",\r
     "text": "王尔恺题的，还能是谁？"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "题是王尔恺题的，做是我表姐 {{e_suwenwan|苏文纨}} 做的。那是她的得意之作，写在扇子上，请王尔恺题个字，装装门面。你当众说它是偷来的——你骂的不是王尔恺，是她。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "方鸿渐张着嘴，半天合不拢。难怪那天她的脸白了一层又红回来；难怪她送客只送到客厅门口。他这一刀，不偏不倚，捅在正地方了。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "speakerEntry": "e_fanghongjian",\r
     "text": "完了。我这辈子，完了。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "完不了。（笑）我表姐那个人，你越得罪她，她越忘不了你。不过——（正色）你以后说话，真得看着点。她那把 {{e_zheshan|折扇}}，如今锁进抽屉里了，谁也不给看。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "speakerEntry": "e_fanghongjian",\r
     "text": "我再去写封信，写十封。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "省省罢。你这人，肚子里有墨水，就是管不住嘴。在外国四年，就学了这个？"\r
    },\r
    {\r

     "speakerEntry": "e_fanghongjian",\r

     "text": "洋式公寓里，灯亮得晃眼。{{e_zhaoxinmei|赵辛楣}} 做东，请了一桌客：{{e_fanghongjian|方鸿渐}}、{{e_suwenwan|苏文纨}}，还有两位名人。主人是美国留学生，最好客。一位是哲学家 [[NPC1]]，夹鼻眼镜，瘦长脸，据说给外国的大哲学家写信，人家回一封，他就多一层光环；那些回信裱在书房里，逢人便讲。一位是旧体诗人 [[NPC2]]，做过外国公使馆的军事参赞，武官出身，诗却写得极文，是名父之子。"\r

     "text": "（举着湿眼镜）人没有这个身体，全是心灵，岂不更好。"\r

    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "我问你一句话，你老实说。我这个人，是不是很叫人讨厌？"\r

     "speakerEntry": "e_fanghongjian",\r

     "kind": "monologue",\r
     "slot": "NPC1",\r
     "text": "算了。明天他醒来，头疼；我今晚睡不着，心疼。扯平了。"\r

     "kind": "narration",\r
     "text": "九月二十二日，船出吴淞口。这条跑宁波的外国小轮船，大菜间只有三间。同船的两位同事口口声声说票难买，把三间大菜间让给了{{e_zhaoxinmei|赵辛楣}}、{{e_fanghongjian|方鸿渐}}和那位小姐，自己甘愿挤统舱。赵辛楣私下对方鸿渐说破：哪是票难买，是省钱——统舱的票价，便宜一半还多。"\r

    },\r
    {\r
     "kind": "dialogue",\r
     "speakerEntry": "e_fanghongjian",\r

     "text": "下了{{e_yilunchuan|意国轮船}}，雨就没停过。一行五人在小镇茶馆里躲了一阵，看雨势不减，只好冒雨赶路。茶馆里挤满了躲雨的人，潮气混着茶味；抬箱子的脚夫蹲在门槛上抽烟，一口一口，全喷在那口大箱子上。"\r

    },\r
    {\r
     "kind": "dialogue",\r
     "speakerEntry": "e_zhaoxinmei",\r
     "text": "（在后头看见，笑得直不起腰）前面走的是谁？活脱脱一个绿毛龟！"\r
    },\r
    {\r
     "kind": "dialogue",\r

    },\r
    {\r
     "kind": "narration",\r
     "text": "他这一回头，伞沿的绿水正滴进他的脖领，众人更笑了。笑归笑，路还是要走。雨深处，山溪上横着一座藤条编的长桥，没有栏杆，两边下塌，桥下的水又急又白。风从溪谷里往上灌，吹得桥身微微地晃。方鸿渐站在桥头，腿先软了。"\r
    },\r

     "text": "雨是从半夜里下起来的。[[NPC1]]把那柄{{e_lvsan|绿绸伞}}从包袱里取出来时，犹豫了一下——那是离家时娘给她遮太阳用的。娘送她到码头，眼睛不好，还硬要替她理包袱，嘴里念叨：路上少说话，多跟着赵叔叔。"\r

     "kind": "narration",\r
     "text": "一程路走下来，他的白衬衫绿了一块又一块，连脸颊都绿了。她把嘴抿紧了，没敢笑。不是不想笑，是不敢笑。这一路上，她笑得最小心，话说得最少，眼睛看得最多。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "过了{{e_xikou|溪口}}的镇子，雨更大了。溪上横着那座藤桥，桥身软塌塌的，没有栏杆，{{e_fanghongjian|方鸿渐}}站在桥头，进也不是，退也不是。"\r

     "slot": "NPC1",\r

     "text": "金华这家大旅社，招牌写着“欧亚”两个字，乾坤却全在别处：牛奶咖啡是咖啡糖冲的，三鲜糊涂面像一碗浆糊，睡到半夜，跳蚤臭虫倾巢而出，咬得人体无完肤。"\r

     "text": "那一夜，四个人挤在两层铺的房间里，女眷在隔壁先睡下了。跳蚤在黑暗里行军，[[NPC4]]被咬得翻来覆去，听见下铺的[[NPC1]]还在摇着扇子，念叨他的卡片和药——那是他全部的家当与前程。"\r
    },\r

    },\r
    {\r

    {\r
     "kind": "monologue",\r
     "slot": "NPC1",\r
     "text": "在{{e_ouya|欧亚大旅社}}，跳蚤咬到后半夜，我索性坐着想心事。"\r
    },\r
    {\r
     "kind": "monologue",\r
     "slot": "NPC1",\r
     "text": "我想的是{{e_limeiting|李梅亭}}那口铁箱。上半箱卡片，下半箱西药，一个人把名声和生意装进同一口箱子，锁得严严实实。白天吃饭，钥匙拴在裤腰上，洗澡都不离身；晚上睡觉，箱子就搁在他床头，比枕头还近。"\r
    },\r
    {\r
     "kind": "monologue",\r
     "slot": "NPC1",\r
     "text": "还有{{e_guerqian|顾尔谦}}。人家说一句，他捧十句，金门牙一闪，“名师必出高徒”喊得比上课还齐。有一回李梅亭说了句“内地缺医少药”，他立刻接“李先生真是菩萨心肠”。我在旁边听着，替他的金门牙累得慌。"\r
    },\r
    {\r
     "kind": "monologue",\r
     "slot": "NPC1",\r
     "text": "从前的我，看见这样的人，是要掉头走开的。如今倒好，同船、同店、同桌吃饭，听他们说话，陪他们赔笑，一天一天，竟也习惯了。"\r
    },\r
    {\r
     "kind": "monologue",\r
     "slot": "NPC1",\r
     "text": "有一瞬间，我竟羡慕他们。他们知道自己要什么：一个要钱，一个要靠山。我要什么呢？我连这个都答不上来。"\r
    },\r
    {\r
     "kind": "monologue",\r
     "slot": "NPC1",\r
     "text": "习惯这东西最可怕。头一天你还笑话人家，第三天你就替人家递名片了。跟什么人同行，就走什么样的路。我跟着这两位走上三千里，走到头，只怕自己身上也染上点铁箱的气味。"\r
    },\r
    {\r
     "kind": "monologue",\r
     "slot": "NPC1",\r
     "text": "可我又能跟谁呢？这年月，兵荒马乱，有路走，有伴同行，已经要谢天谢地了。要是从前认识的人看见我现在这副样子——算了，不想也罢。"\r
    },\r
    {\r
     "kind": "monologue",\r
     "slot": "NPC1",\r
     "text": "窗外狗叫两声，也睡了。我裹紧被子，像裹紧最后一点体面。"\r
    },\r
    {\r
     "kind": "monologue",\r
     "slot": "NPC1",\r
     "text": "天亮还要赶路。睡罢。前日过{{e_tengqiao|藤条长桥}}，腿肚子到现在还发软；横竖我这人，到哪儿都是凑数的。"\r
    }\r
   ],\r

   "segments": [\r
    {\r
     "kind": "narration",\r
     "text": "这家小客店的墙，是过往客人留言的地方。石灰墙上题得密密麻麻：「酒不醉人人自醉，色不迷人人自迷」，「孤王酒醉鹰潭宫」；还有一条起头写着“注意”、落款缀着“有毒”二字的警告，中间夹着一个女人的芳名。一代一代的客人把这点心思全涂在墙上，白的盖了黑的，从来没断过，墙皮都厚了一层。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "晚饭的风肉里吃出了蛆。同行的伙伴叫店主来看，店主把肉片端详半天，理直气壮。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "speaker": "店主",\r
     "text": "这不是虫呀，没有关系的，这叫“肉芽”——“肉”——“芽”。肉里自己长出来的芽，鲜得很！"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "同行的伙伴恶心得放下筷子。店主倒好，把那片肉夹起来，自己吃了。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "[[NPC3]]这几天却格外精神。他不知从哪里搭上了[[NPC1]]——一个尖颧削脸的女人，上海逃难来的，做的什么营生，墙上的题字写得明白。两人时常在楼梯口说话，他说一句，她笑一声。有人看见他把一包东西塞给她，她掂了掂，笑得眼睛眯成一条缝。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC3",\r
     "text": "（对同行的人，自夸）我知道这种女人路数多，有时用得着她们。这就是孟尝君结交鸡鸣狗盗的用意。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "speaker": "店主",\r
     "text": "（凑趣）先生是明白人。这地方，路数最要紧。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "果然，门路来了。由[[NPC1]]牵线，[[NPC3]]见到了此地管军车的[[NPC2]]——桔皮似的一个大鼻子，说话像打雷。[[NPC3]]摸出{{e_mingpian|名片}}双手奉上，头衔印了三行；对方接过去，看也不看，揣进兜里。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（笑）营长，这几位是内地大学里去的先生，都是体面人。您行个方便。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC2",\r
     "text": "（呷了一口酒）内地去教书？好志气。只是我这车，是军车。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC3",\r
     "text": "（递烟，赔笑）所以来求营长。军车稳当，又快。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC2",\r
     "text": "稳当？翻下山的也不是没有。（大笑，随即把脸一沉）我们这货车不能私带客人的，带客人违犯军法，懂不懂？"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC3",\r
     "text": "营长，通融通融。行李不多，就一口箱子。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC2",\r
     "text": "箱子？女人不带，铁箱也不带。军车拉的是军粮弹药，不是家当。你们要上车，人，我数着带两个；东西，一件不留。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "这一说，满桌都冷了。铁箱是[[NPC3]]的命根子，女眷又万万丢不下。买卖谈崩了，[[NPC3]]脸上的笑挂不住；[[NPC1]]在旁边，倒像看一出不相干的戏。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC2",\r
     "text": "（起身）酒钱我付了。诸位先生，一路顺风——汽车站在城东。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（起身，掸掸衣裳）营长的军法大，先生的箱子也大。我一个妇道人家，管不了这些。楼上有客，失陪了。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "她上楼去了，鞋跟敲着木楼梯。墙上的题字在油灯下泛着白，那句“色不迷人人自迷”，也不知是题给谁的。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC3",\r
     "text": "（对着楼梯口，低声骂）势利！——（把那盒没送出去的烟揣回怀里）明日还是去汽车站排队罢。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "当夜，[[NPC3]]把那叠没派上用场的名片，数了一遍又一遍。"\r
    }\r

    {\r
     "kind": "narration",\r
     "text": "这趟公路汽车，是从不讲究对号入座的。车站里人挤人，挑夫的扁担、卖鸡蛋的吆喝搅成一锅粥；车一来，人群像决了堤。[[NPC1]]一行挤上车时，好位置早没了，只剩一个油脸汉子旁边空着半个座——座上端端正正放着一袋米。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "{{e_sunroujia|孙柔嘉}}一路晕车，脸色白得像纸。[[NPC1]]扶她过去，请那汉子把米袋挪一挪。"\r

     "kind": "dialogue",\r

    },\r
    {\r
     "kind": "dialogue",\r
     "speaker": "油脸汉子",\r
     "text": "天经地义？我的米是要拿去交军粮的！压坏了你赔？"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（火往上撞，嗓门也高了）压不坏。真压坏了，我赔！米是吃的，人是活的，你抱着米坐一辈子罢！"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "他这一嚷，满车都看过来了。那汉子到底心虚，嘟囔着把米袋抱上膝盖，让出半个座位。孙柔嘉坐下来，轻轻舒了一口气。"\r
    },\r

     "speakerEntry": "e_sunroujia",\r

    },\r

     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "谢什么。路还长，你睡一会儿罢。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "车开了，那汉子一路把米袋抱在怀里，像抱着个祖宗牌位。后座上，一位{{e_guafu|苏州寡妇}}——丈夫新死，带着男仆阿福，去桂林投奔夫兄——正跟{{e_limeiting|李梅亭}}说得热闹。李梅亭不知什么时候挪过去的，墨晶眼镜笑成两条缝。"\r

     "kind": "dialogue",\r
     "speakerEntry": "e_limeiting",\r
     "text": "太太到桂林投亲？巧得很，我们也往那边去。一路上，也好有个照应。有什么重活，只管吩咐。"\r
    },\r

    },\r

    },\r

     "text": "下了{{e_nancheng|南城公路汽车}}，到了这座赣中城市，五个人才知道什么叫走投无路。学校的{{e_pinshu|汇款}}早到了，躺在中央银行的账上；银行却要本地商铺作保才肯放款。五个人看着那两扇铁门，像看着一口锁着的米缸。"\r

     "speaker": "办事员",\r

    },\r

     "kind": "narration",\r

    {\r

    {\r

     "speaker": "办事员",\r

    },\r

     "text": "钱取不出，五个人只好挨饿。房钱尚欠着，起先还下小馆子，后来改成馒头稀饭，再后来，稀饭也改成一天两顿。同行的一位老兄把裤带紧了两个眼，逢人便说减肥。[[NPC2]]饿得在屋里来回走，像头困兽。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC2",\r
     "text": "气死我了，梦里都没有东西吃，别说醒的时候了。"\r
    },\r
    {\r

    },\r

     "speaker": "教育局长",\r
     "text": "（慢条斯理）我是老上海，上海滩上什么玩意儿全懂。“国立三闾大学”？这名字生得很，我从来没听见过。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC3",\r
     "text": "（急了）局长，我们是货真价实的大学教授！校长是部里派的！"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "speaker": "教育局长",\r

    },\r
    {\r
     "kind": "narration",\r
     "text": "碰了一鼻子灰回来，[[NPC1]]却在后街撞见一桩怪事：[[NPC3]]蹲在墙角，背着人，捧着两只烤山薯，吃得又急又香，嘴角乌黑。看见人来，他慌忙把剩下的塞进袖子，掏出手帕擦嘴，擦得很斯文。那两只山薯的钱，够买四个人的稀饭。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC3",\r
     "text": "（讪讪）我……我这是替大家尝尝，怕有毒。"\r
    },\r
    {\r

     "slot": "NPC1",\r
     "text": "（气得笑出来）有毒没毒，你一个人尝两个？大家都在旅馆里饿着。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC3",\r
     "text": "（正色）饿，也要讲个体统。我这胃病，是饿不得的。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "当晚，几个人把冷馒头掰开分食。[[NPC1]]越想越惭愧。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "我最惭愧了，这次我什么事都没有做，真是饭桶。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC3",\r
     "text": "（有了山薯垫底，话也硬了）这位贵人是真正的贵人，坐在旅馆里动也不动，我们替他跑腿。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC2",\r
     "text": "（把桌子一拍）都少说两句！饿着肚子吵架，费粮食。明日我再去银行。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "你的脸，比名片也厚不了多少。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC2",\r
     "text": "（不恼，反而笑）厚些好，厚些顶事。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "一直不声不响的[[NPC4]]，这时从包袱里取出自己的毕业文凭。文凭上贴着戴方帽子的照相，眉目清秀。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC4",\r
     "text": "（轻声）明天，让我出去试试罢。我在上海念书时，认得一位学姐，就在妇女协会做事。成不成，总得试试。坐着饿，不如走着饿。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC3",\r
     "text": "（撇嘴）妇道人家，能成什么事。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC2",\r
     "text": "让她去。反正咱们已经穷得只剩时间了。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "屋里静了一瞬。没人把这句话当真，可也没人拦她。油灯芯子哔剥响了一声，照着几张饿瘦了的脸。"\r

    },\r

     "kind": "dialogue",\r

     "text": "帖子是{{e_wangchuhou|汪处厚}}下的，请{{e_zhaoxinmei|赵辛楣}}和{{e_fanghongjian|方鸿渐}}到[[地点]]吃饭，说是内人要替他们做媒。黑砖半西式平屋，跟校舍隔一条溪，是校舍以外本地最好的建筑。客堂很显敞，砖地上铺了席，红木老式桌椅，大方结实——万一离校别有高就，还可以卖给学校。"\r

    },\r
    {\r

     "text": "两位小姐，主人早有安排。[[NPC2]]是女生指导，比另一位年长些，戴白金脚无边眼镜——那眼镜彷佛不着边际，多少和脸蛋儿融化为一，只有看戏的时候必需用到。她爱话剧，一进门就画了个无形的圈子，把自己跟赵辛楣围在里面，谈话密切得泼水不入。"\r

     "slot": "NPC2",\r
     "text": "赵先生，我真高兴，你的意见跟我完全相同！你觉得他哪一个戏最好？"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "[[NPC3]]是外语系主任的妹妹，历史系毕业，当着助教，最后一个到。坦白可亲的脸，身体很丰满，衣服颇紧，一动，衣服上就起波纹。做媒的把她说给方鸿渐，把指导小姐说给赵辛楣——一个配副教授，一个配系主任，斤两都是算好了的。"\r
    },\r
    {\r

     "text": "只是这两位小姐彼此都看不上眼：指导小姐嫌助教小姐衣裳紧，助教小姐嫌指导小姐胭脂红。席上一个是话太多，一个是话太少，做媒的一双眼睛在两边来回地救火。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "席到半酣，门帘一挑，{{e_gaosongnian|高松年}}不请自来，笑道进来讨顿便饭。熟人吃便饭，并且有女人，他当然谑浪笑傲，另有适应。主人添杯箸，座上更热闹。"\r

     "speakerEntry": "e_wangchuhou",\r
     "text": "我在华阳大学的时候，他们有这一比：讲师比通房丫头，教授比夫人，副教授呢，等于如夫人。这一字之差，不可以道里计。丫头收房做姨太太，是很普通的事；姨太太要扶正做大太太，那是干犯纲常名教，做不得的。"\r

     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "同屋的小姐告诉我的。她为赵叔叔还了他的书，跟那家女主人好像吵翻了，不再去了。今天中午，男主人来个条子，说太太病了，请她去——她去了这时候才回来，痛骂赵叔叔，说他调戏人家，把她气坏了。还说她自己早看破赵叔叔这个人不好，所以不理他。"\r

     "kind": "dialogue",\r
     "speakerEntry": "e_fanghongjian",\r

    {\r

     "text": "两个人走了一段路，都不说话。山里的傍晚静得很，脚步声也显得空落落的。她忽然柔懦地开口——"\r

    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "赵叔叔走了！只剩我们两个人了。"\r

     "kind": "dialogue",\r
     "speakerEntry": "e_fanghongjian",\r

    },\r
    {\r

     "text": "他想起那位临走的嘱咐：照顾她。那时候他随口应下来，此刻才知道「照顾」两个字有多重——他连自己都照顾不好。"\r

    {\r
     "kind": "dialogue",\r
     "speakerEntry": "e_fanghongjian",\r

    },\r

     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "不知道什么浑蛋——我疑心就是{{e_luzixiao|陆子潇}}——写匿名信给爸爸，造——造你跟我的谣言，爸爸来信问——"\r

    }\r

     "kind": "narration",\r
     "text": "解聘的事早就成了定局。学期一结束，全校的聘约都发出去了，独独没有他的。离校这天，行李先捆好上路，两人各坐一顶轿子下山。在这乡下的学堂里待了整整一年，临走时送到山口的只有几个学生，拎着一篮鸡蛋，站在路口不知道说什么好。同事一个也没有露面。"\r
    },\r
    {\r
     "kind": "narration",\r

     "kind": "dialogue",\r
     "speaker": "学生",\r
     "text": "（跟在轿子后头，嗫嚅）先生，您下学年……还回来教我们么？"\r

     "text": "那篮鸡蛋，到底没收。[[NPC1]]让学生们提了回去，说先生不缺这个，孩子们家里缺。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "走到半山，后面有人一路喊着追上来——是校长{{e_gaosongnian|高松年}}派来的听差，气喘吁吁，递上一封信，信封里还夹着一张贺他们新婚的礼券。听差说，校长本来要亲自来送的，校务太忙，实在脱不开身。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "speakerEntry": "e_fanghongjian",\r
     "text": "（拆开看了两行）说得倒客气：抱歉呀，惋惜呀，后会有期呀。真惋惜，当初就不会连聘约都不送了。"\r
    },\r

     "kind": "narration",\r
     "text": "[[NPC1]]伸手把信拿过去，从头看了一遍，一声不响，把信纸连同信封揉成一团。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（扬手把纸团丢进路边的水潭）走罢，别看了。这种人的字，脏眼睛。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "speakerEntry": "e_fanghongjian",\r
     "text": "（愣了愣）你倒痛快。那礼券呢，也扔？"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "礼券不脏，留着。白给的不要，那是跟自己的口袋过不去。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "轿子重新上路。方鸿渐回头看了一眼，水潭里那团纸打着旋，转眼就沉了。他想起自己那封痛骂校政的信，本打算随聘约退回去，人家连这个机会都没给。这一年，也像那封信：揉皱了，丢掉了，也就算了。"\r

     "text": "（催促轿夫）天要热了，快走罢。早点赶到镇上，还赶得上今天的车。到了上海，有的是正经事要办。"\r

     "text": "离开{{e_sanlu|三闾大学}}的前一夜，他独自在宿舍里收拾书箱。"\r
    },\r

     "kind": "monologue",\r

     "text": "来了一整年，走的时候是什么样，我早就该想到了。聘约一张一张发下去，唯独没有我的——连一句当面的话都省了。"\r

     "kind": "monologue",\r
     "slot": "NPC1",\r
     "text": "书没几本，收拾起来倒沉。都是些路上翻过的旧书，跟着我跑了半个中国，也没读出什么名堂，如今又要跟着我跑回去。"\r
    },\r
    {\r
     "kind": "monologue",\r
     "slot": "NPC1",\r
     "text": "想想也好笑。来的时候，五男一女，浩浩荡荡，何等热闹；走的时候，只剩我和她两个人，倒比来时还整齐。"\r
    },\r

     "kind": "monologue",\r
     "slot": "NPC1",\r
     "text": "明天一早下山。听说会有几个学生来送；同事呢，一个也不会来。我在这里是多出来的人，多出来的人走了，正合大家的意。那几个学生，大概是真心来送的，可惜我教他们的那门课，连我自己都忘了。"\r
    },\r
    {\r
     "kind": "monologue",\r
     "slot": "NPC1",\r
     "text": "{{e_gaosongnian|高松年}}校长大概觉得对不住我，又不见得真觉得。他那样的忙人，少我一个，多我一个，于他的学校有什么分别。"\r

     "text": "人说，离开一个地方，就等于死一次。我在这里认识的几个人，住过的这间屋子，从明天起，就都死了，埋了。"\r

     "slot": "NPC1",\r
     "text": "死过几回了，也不差这一回。只是天大地大，下一个地方，又是什么呢。……把灯吹了罢。这屋子，明天就是别人的了。"\r
    }\r

     "kind": "narration",\r
     "text": "在{{e_guilin|桂林旅馆}}等了十几天的票，好容易飞到香港，{{e_fanghongjian|方鸿渐}}吐了两天才缓过劲。这天他独自出门会老朋友。[[NPC1]]如今进了国防委员会，人还是老样子：高大，轩昂，烟斗不离手，一见面就嚷着请客。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "两人进了一家外国人开的馆子。红白格子桌布，刀叉齐整，窗外电车叮叮地过。吃了一年糙米饭，这一桌刀叉，他看着眼生。"\r
    },\r
    {\r

     "speakerEntry": "e_fanghongjian",\r
     "text": "（笑）你这爱请客的老毛病，到了香港也没改。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "改不了喽。在内地那一年，我最想的就是找人吃顿像样的饭。（四下一看）有电车，有海，有牛排——人到底要住在人住的地方。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "speakerEntry": "e_fanghongjian",\r
     "text": "你在委员会里，忙些什么？"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "忙！开会，拟章程，见客人，忙得痛快，比在乡下教书强一百倍。（忽然想起）你回上海，工作包在我身上。报馆我有熟人，回头就替你写信。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "菜上来，酒斟上。[[NPC1]]忽然放下刀叉，压低声音。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "哎，你跟她，打算什么时候办？"\r
    },\r

     "speakerEntry": "e_fanghongjian",\r

     "slot": "NPC1",\r
     "text": "装糊涂。结婚！我劝你们两位赶快用最简单的手续结婚，不必回上海举行仪式。注册签字，半天了事。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "speakerEntry": "e_fanghongjian",\r
     "text": "这么急？"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（切牛排）我替你算过了：你们同甘共苦过来，根基有。可到了上海，两个家庭一搅和，事情就多了。先把名分定下来，最稳当。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "他说得恳切，方鸿渐点头。提到{{e_sunroujia|孙柔嘉}}，[[NPC1]]看了他一眼，欲言又止。"\r
    },\r

     "slot": "NPC1",\r

     "kind": "dialogue",\r
     "slot": "NPC1",\r

    },\r
    {\r
     "kind": "narration",\r
     "text": "他不肯再说，举杯岔开话，说起新交的四川女朋友——爽利，能吃辣，骂起人来像炒豆子。"\r

    {\r

     "text": "酒到半酣，方鸿渐谈兴倒上来了，抛出一套{{e_putao|葡萄论}}。"\r

    {\r

     "speakerEntry": "e_fanghongjian",\r
     "text": "天下只有两种人。譬如一串葡萄到手，一种人挑最好的先吃，另一种人把最好的留在最后吃。照例，第一种人应该乐观，他每吃一颗，都是吃剩的葡萄里最好的；第二种人应该悲观，他每吃一颗，都是吃剩的葡萄里最坏的。可事实上倒过来：第一种人只有回忆，第二种人还有希望。"\r
    },\r

     "slot": "NPC1",\r

    {\r
     "kind": "narration",\r
     "text": "两个老同学碰了杯。窗外电车又叮叮地过去。方鸿渐觉得，香港真是个好地方——饭菜可口，朋友热心，前程似乎有了眉目。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "只是回家路上，他想起那句没头没尾的“煞费苦心”，咯噔一下，又笑自己多心：老朋友喝多了的话，也能当真？"\r

   "segments": [\r
    {\r
     "kind": "narration",\r
     "text": "在内地那座小城，{{e_fanghongjian|方鸿渐}}和她两个人，等了十几天的飞机票。机票比船票金贵十倍，托了多少层关系才买到两张。这十几天，倒是近来最松快的日子：白天逛街看山，城外有名的山洞，洞口漆黑，两人站在洞口望了望，没敢进去；晚上回旅馆，分一碗滚烫的米粉，推来推去，连汤都喝得干干净净。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "speakerEntry": "e_fanghongjian",\r
     "text": "（收拾行李，兴奋）明天就真的上天了。你怕不怕？"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（嘴硬）我怕什么。飞机比船稳当，书上说的。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "speakerEntry": "e_fanghongjian",\r
     "text": "（逗她）书上还说，天上的云，躺在上面比鸭绒被还软。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（白他一眼）你去躺。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "结果上了天才知道厉害。飞机一爬高，引擎轰得人牙关发酸，机身在云里一颠一簸。[[NPC1]]的脸白了，捏着纸袋，一句话说不出来，先前嘴的硬气全还给了云彩。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（有气无力）我不行了……这东西，比船坏十倍。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "speakerEntry": "e_fanghongjian",\r
     "text": "（自己也头晕，还嘴硬）深呼吸，闭上眼，想点高兴的事。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（闭着眼）我想的是……旅馆的床。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "邻座的客商吐得比他们还响。两个人彼此看了一眼，谁都笑不出来，只剩交握的手心里一把汗。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "一路吐到终点。下飞机的时候，她两条腿是软的，全靠方鸿渐架着走。来接机的是{{e_zhaoxinmei|赵辛楣}}，老远就挥手，烟斗举得高高的。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "speakerEntry": "e_zhaoxinmei",\r
     "text": "（大笑）好你个家伙，把新娘子折腾成这样！走，上车，今晚我做东，给你们接风！"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "到了旅馆，[[NPC1]]一进门就躺倒了，连晚饭也不想起来吃。老朋友把他们送到房门口，再三嘱咐晚上务必赏光，才笑着走了。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（躺着，声音蔫蔫的）晚上的接风宴，你去罢，我不去了。替我跟人赔个不是。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "speakerEntry": "e_fanghongjian",\r
     "text": "你一个人，行吗？"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（翻身朝里）行。我睡一觉就好。你少喝点酒，早点回来。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "方鸿渐替她掖好被角，出了门。她躺着，听走廊上的脚步声远了，忽然想起离家时娘说的话，鼻子一酸——这地方，到底是人地两生。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（自言自语，又笑自己）吐成这样……第一回坐飞机，就给他看了笑话。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（迷迷糊糊）下回……下回还是坐船罢。船慢，慢有慢的好处。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "这一晚她睡得很沉。梦里没有飞机，也没有山，只有那座等票的小城，和一碗两个人分着吃的米粉，还冒着热气。后来的日子，她再没过得那么松快过。"\r
    }\r
   ],\r

   "segments": [\r
    {\r
     "kind": "narration",\r
     "text": "到香港的第三天，小两口在{{e_xglvguan|香港旅馆}}接到口信：主人家的老太太再三相邀，请上山拜见。洋房在半山，阳台上望得见海。开门的是老太太自己，身后跟着她的儿子[[NPC4]]——高大，轩昂，衔着烟斗。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "speaker": "赵老太太",\r
     "text": "（拉着年轻人的手）可来了！快进来坐。这就是你的新太太？真秀气！"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "新娘[[NPC2]]穿一件素色旗袍，长圆脸，颊上几点雀斑，怯怯叫了声伯母，把备下的衣料递上。老太太越看越欢喜。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC2",\r
     "text": "（低声，礼貌）伯母，早该来给您请安。一路上多亏您儿子照应。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "speaker": "赵老太太",\r
     "text": "（笑得合不拢嘴）好孩子，好孩子。坐，坐在我旁边。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "客厅里还坐着一位女客。旗袍花得像欧洲小国的国旗；人比从前丰腴，头发烫得时新，膝上搁着亮漆小皮箱——要送老太太的外国化妆品。[[NPC1]]起身，笑吟吟的，一双眼睛把新娘从头到脚量了一遍。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "speaker": "赵老太太",\r
     "text": "（介绍）你们还不认识罢？这位是曹太太——留法回来的女博士。她跟我们儿子，是二十多年的老朋友。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（声音低得似乎不准备给人听见）这位太太——是不是还是那家什么银行？钱庄？唉，我记性真坏——经理的小姐？"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "满座都听见了。[[NPC2]]脸上的笑僵住，到底没接话。她丈夫[[NPC3]]在旁边红了脸，咳了一声，又咽了回去。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "speaker": "赵老太太",\r
     "text": "（打圆场）什么银行钱庄的！你们年轻人记性都好，就我老婆子糊涂。吃糖，吃糖。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC4",\r
     "text": "（岔开，响亮）妈，人家新婚，你盘问底细做什么！来来，喝茶——朋友从内地捎来的。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC3",\r
     "text": "（跟着岔开）山上风凉，比底下舒服多了。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "speaker": "赵老太太",\r
     "text": "（又拉着新郎问）你在德国念的什么？哲学？如今在报馆做事？唉，早点生个孩子，你爹妈要抱孙子喽。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC3",\r
     "text": "（越发红了脸）伯母——"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC4",\r
     "text": "（大笑）妈！你这连珠炮，比委员会的质询还密。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "花旗袍的女客浑不在意，自顾自拨着茶盖，忽然笑吟吟转向[[NPC4]]。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "你妈那儿，还保存我许多信呢。她说，要当我的面，一封一封的检，挑她现在不能接受的信还给我。（眼波一转）你说好笑不好笑？"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "speaker": "赵老太太",\r
     "text": "（佯恼）你这张嘴！你的信我一封没拆过。留着，都是替你存脸面。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "[[NPC4]]衔着烟斗笑，不接话。这两家二十多年的交情，只有新娘头一回见识，捧着茶杯，坐得笔直。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（眼风在他脸上一停）你也不小了，还不成家？当年——（抿嘴一笑）算了，当我没说。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC4",\r
     "text": "（吐出一口烟，淡淡）快成了。到时候，请你吃喜酒。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（又转向老太太）我过几天又要飞重庆。化妆品、药品、高跟鞋，您要什么我给您捎。——快买外汇，再迟就涨上天了。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "speaker": "赵老太太",\r
     "text": "（欢喜）还是你疼我！你先生呢？{{e_caoyuanlang|曹元朗}}先生怎么不一道来？"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "他？他忙他的诗去了。（笑）我们各忙各的。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "告辞出来，山路上斜阳正好。[[NPC3]]一路找话说，[[NPC2]]只“嗯”着，一张脸从山上冷到山脚。"\r

   "cgPrompt": "Bright Japanese anime style, 1930s Hong Kong hotel room at dusk, a paper bag of lychees on the table, one peeled lychee held out, a young wife wiping tears with a reluctant smile (seen from behind), warm lamplight, reconciliatory mood.",\r
   "cgChars": [\r

   "segments": [\r
    {\r
     "kind": "narration",\r
     "text": "从{{e_zhaojiashan|赵家山上}}下来，一路无话。[[NPC1]]回到旅馆，门一关，把手提包往床上一摔。{{e_fanghongjian|方鸿渐}}跟进来，顺手带上门。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "白天山上的事还在她眼前：{{e_suwenwan|苏文纨}}那身花旗袍，那句低得不像要给人听见的“经理的小姐”，一屋子装聋作哑的人。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（发作）你今天倒好，坐在那儿，一声不响，由着人糟蹋我。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "speakerEntry": "e_fanghongjian",\r
     "text": "（赔笑）我这不是怕越描越黑么。老太太在坐，跟她吵起来，多不好看。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "面子！你要面子，我不要面子？我嫁到你们家，头一回见你的老朋友，就被人盘问是不是钱庄经理的小姐——我是什么？我是来听这个的？"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "好看！她问我是哪家钱庄经理的小姐，那就好看？"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "speakerEntry": "e_fanghongjian",\r
     "text": "（皱眉）话不能这么难听。她再不是，也是主人家的客。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "客？她是存心给我难堪，你当我听不出来？（冷笑）还保存信呢，要当着面一封一封地检——做给谁看？做给我看！"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "自己有了丈夫，还要跟辛楣勾搭，什么大家闺秀！我猜是小老婆的女儿罢。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "speakerEntry": "e_fanghongjian",\r
     "text": "（忙拦）小声点，旅馆墙薄。"\r

     "kind": "dialogue",\r
     "speakerEntry": "e_fanghongjian",\r
     "text": "（劝）她那个人，向来说话带刺，对谁都一样，你何必——"\r
    },\r

     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（眼睛一下子红了）你还替她说话！"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（声音发颤）好容易千方百计嫁到你这样一位丈夫，还敢不小心伺候麽？"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "这话说得又尖又酸，酸里却全是委屈。方鸿渐听出味道不对，忙放软了。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "speakerEntry": "e_fanghongjian",\r
     "text": "（坐下，低声）是我不好。明天我就回绝她，再不上那座山——你忘了？在{{e_aoguo|奥国馆子}}，他还劝咱们赶快注册呢。咱们俩，不是彼此不讨厌么，够了。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（别过脸去）谁要你回绝？你们是老朋友，二十多年，我一个外人，算什么。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "speakerEntry": "e_fanghongjian",\r
     "text": "你是太太。太太最大。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "她扑哧一声，眼泪却下来了。方鸿渐慌了，掏出下山时买的一袋荔枝，剥了一颗，壳红肉白，递到她嘴边。"\r
    },\r

   "segments": [\r
    {\r
     "kind": "narration",\r
     "text": "回上海没几天，{{e_fanghongjian|方鸿渐}}带{{e_sunroujia|孙柔嘉}}拜见公婆。两家{{e_qinjin|结为秦晋}}，新媳妇头一回正式上门。石库门房子，堂屋供着祖先牌位。[[NPC1]]是前清举人，天天在家读书、写日记；[[NPC2]]吃斋念佛，最讲究规矩。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "新媳妇穿时新旗袍，脚上一双白皮鞋，拎着衣料点心。一进门，[[NPC2]]的眼皮就跳了——孝服才用白，不吉利。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "按老规矩，新人要跪拜祖先。拜垫早铺好。孙柔嘉走到牌位前，端端正正鞠了三躬。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC2",\r
     "text": "（愣住）这……不跪？"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "speakerEntry": "e_sunroujia",\r
     "text": "（平静）妈，现在时兴鞠躬。我在学校里，对总理遗像，也是鞠躬的。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "[[NPC1]]坐在太师椅上，捻着胡子没作声。老人家今早的日记，怕又要多一条了。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC2",\r
     "text": "（又打量她，叹气）你们在香港就这么注册了？喜酒也不办一桌，亲戚面前，我们这脸往哪儿搁。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "speakerEntry": "e_sunroujia",\r
     "text": "（不慌不忙）妈，战时从简，是政府提倡的。省下那笔酒席钱，够我们小家用三个月。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "敬茶她都双手捧上，一样不少；该叫的爸妈，一声不少。只是腰杆挺直，没有半分讨饶。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（缓缓）礼也者，天地之序也。罢了，新派有新派的做法。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC2",\r
     "text": "（摸着那块衣料，淡淡）倒舍得花钱。你们小两口单过，开销要省着点。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "[[NPC1]]又问了她娘家的人口，她一一答了。开饭了，{{e_achou|阿丑}}满桌跑，他娘{{e_ernainai|二奶奶}}拉都拉不住。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "speakerEntry": "e_achou",\r
     "text": "（忽然仰脸问）大伯伯，什么叫“关系”？你是不是跟大娘在学堂里有“关系”的？"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "满桌一静。二奶奶一把捂住儿子的嘴。{{e_sannainai|三奶奶}}抿嘴笑，眼睛把新娘的料子、手表、皮鞋一样样估了价。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "speakerEntry": "e_ernainai",\r
     "text": "（打岔，笑）大嫂这身料子真好，是国货还是洋货？"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "speakerEntry": "e_sannainai",\r
     "text": "（接话）洋货罢？瞧这织法。大嫂娘家人，到底讲究。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "speakerEntry": "e_sunroujia",\r
     "text": "（淡淡）不值什么的，穿着玩。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "正乱着，阿丑一挣，碰翻了酒杯，一杯酒全泼在新媳妇的旗袍上，白皮鞋也溅湿了。阿凶在三奶奶怀里，拍手直乐。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "speakerEntry": "e_sannainai",\r
     "text": "（笑着，不冷不热）哎哟，小孩子家认生，嫂子别见怪。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "speakerEntry": "e_fanghongjian",\r
     "text": "（忙递手帕）没事没事，小孩子皮。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "饭后，[[NPC1]]把儿子儿媳叫到跟前，端起举人的架子，缓缓开口。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "我总觉得，女人的责任是管家。男子治外，女子治内，这是几千年的道理。你们对你们的丈夫，总要服侍得他们称心。你在外头那个差事，我看，辞了罢。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "满屋静下来，等她回话。方鸿渐忙笑着岔开。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "speakerEntry": "e_fanghongjian",\r
     "text": "（笑）爸，这道理德国也有：教堂、厨下、孩子，三样都顶着个 K 字，叫{{e_sank|三 K 运动}}。如今人家也不时兴了。"\r
    },\r

     "kind": "dialogue",\r
     "speakerEntry": "e_sunroujia",\r
     "text": "（不慌不忙）爸，我辞了职，家里开销谁出？您儿子赚多少钱一个月，可以把我供在家里？"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "一句话把老举人问住了。她挣的比他儿子多一倍——这话，公公没脸说，儿子也没脸听。"\r

     "kind": "dialogue",\r

     "text": "（叹气，低声）现在的媳妇，一张嘴比刀快。哪里像个新娘。"\r

    {\r
     "kind": "narration",\r
     "text": "告辞出来，孙柔嘉踩着那双溅酒的白皮鞋，一路没说话。方鸿渐知道不妙，也不敢先开口。"\r

    {\r
     "kind": "narration",\r
     "text": "从公婆家回来，她一个人在灯下坐了许久。旗袍上的酒渍还没干。"\r
    },\r

     "kind": "monologue",\r

     "text": "一双白皮鞋，犯了他们家的忌。我哪里知道？就是知道，我也不信这个。新派的人，不穿白，难道穿红？"\r

     "text": "拜垫铺在那儿，等我跪。我爹我妈，我都没跪过几回，凭什么跪他家的牌位？三个躬，一个不少，礼数到了。"\r

     "kind": "monologue",\r
     "slot": "NPC1",\r
     "text": "{{e_fanglaotai|方老太太}}说我嘴快，不像个新娘。新娘该什么样？低眉顺眼，问一句答一句，最好不说话，光会笑？"\r

     "kind": "monologue",\r

   "segments": [\r
    {\r
     "kind": "narration",\r
     "text": "单过的第三天下午，门环响了。[[NPC1]]开门一看：夫家的两位弟媳妇结伴来了——说是瞧瞧新嫂子的新家，四只眼睛先把两间小房扫了一遍，连窗台上的灰都没放过。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "先进门的是[[NPC2]]，就是上回在公公席上问出“什么叫关系”的{{e_achou|阿丑}}的娘，人最精明；后头跟着[[NPC3]]，她家阿凶才两岁，是有名的小霸王——她本人一张嘴，比孩子还厉害。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC2",\r
     "text": "（四处打量，笑）嫂子这里真清爽！朝南两间，多好。这租金一个月得多少罢？"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（淡淡）托人面子租的，不贵。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC3",\r
     "text": "（接得飞快）不贵是多少？我们是替大哥关心。他那点薪水，够开销么？"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC3",\r
     "text": "（笑）嫂子过门，我们连杯喜酒都没喝着。香港注册的，时髦，长辈跟前不好说。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（不软不硬）战时从简。酒什么时候都补得上，二位得空，我来做东。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "[[NPC1]]斟了茶，不接话。[[NPC2]]踱进里间，摸着那堂新家具，一叠声地赞。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC2",\r
     "text": "好木头！这是陪嫁的罢？姑太太给的？啧啧，这一堂，得这个数罢？（伸出几个手指）"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC3",\r
     "text": "（凑过来）姑太太真阔，纱厂人事科长，手眼通天。嫂子命好，娘家有人。（话锋一转）不像我们，嫁过来时箱子是旧的。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（又快又脆）家具是姑母送的，价钱我不知道。茶凉了，吃茶。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "两个人坐了一下午，把房里东西问了个遍：被面什么料子，首饰几件，冰箱谁家的，连厨房那口锅都翻过来看底。[[NPC1]]答一句，留三句。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC2",\r
     "text": "（忽然）嫂子陪嫁的首饰怎么不戴？收着也是收着，改天借我们开开眼。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（笑，不接）有什么好看的，都是些不值钱的。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC2",\r
     "text": "（又笑）嫂子一个月挣多少？比大哥还多？女人家挣得多是本事——就是，辛苦大哥了。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（垂眼，笑）挣多挣少，都是辛苦钱。大哥的薪水，我也没数过。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC2",\r
     "text": "（环顾）这两间房，听说是大哥他爹的面子租的？到底是一家人，分什么彼此。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（笑）是托了公公的面子。房租，可是我们自己出的。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "一句话把“一家人”轻轻挡了回去。[[NPC2]]碰了个软钉子，又去掀窗帘的料子。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC3",\r
     "text": "（掀着窗帘）这料子做窗帘，可惜了，够做件褂子的。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC3",\r
     "text": "（临走，笑）嫂子别嫌烦。我们替老太太来看看——她惦记儿子，怕他吃苦。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC2",\r
     "text": "（也笑）就是，以后常来常往。嫂子家这娘姨，看着倒能干，工钱不小罢？"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "送走客人，[[NPC1]]把两杯剩茶泼进水槽，晚饭也没胃口。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "她那爱写日记的公公，前几日写道：「夫春秋之时，秦晋二国，世缔婚姻，而世寻干戈。亲家相恶，于今为烈，号曰秦晋，亦固其宜。」话迂，却是实话——这两家，从结亲那天起就互相瞧不起：这边嫌那边简慢，那边嫌这边陈腐。"\r
    },\r

   "segments": [\r
    {\r
     "kind": "narration",\r
     "text": "两间小房刚收拾出个人家的样子：新家具上了蜡，窗台上摆了盆文竹。这天傍晚，公公{{e_fangdunweng|方遯翁}}派人送来一件东西——一只{{e_laozhong|祖传老钟}}，老红木壳，玻璃罩，铜摆一明一暗，像个有年纪的长者，说是给小两口镇宅。"\r

    {\r
     "kind": "narration",\r
     "text": "送钟的是家里的老佣人，临走恭恭敬敬带话说：「老爷交代，这只钟走得非常准，他昨天试过的。每点钟只走慢七分钟——请少爷少奶奶记好，要走慢七分钟。」"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "{{e_fanghongjian|方鸿渐}}把它摆在五斗橱上，左看右看。[[NPC1]]凑过来，两个人对着它研究了半天，像研究一件刚出土的文物。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（先看说明似的）老太爷试过的——试出来每点钟慢七分钟，还说非常准。你爹这个人，糊涂都糊涂得一本正经。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（忍笑）每点钟慢七分钟。照这样说，它短针指的七点钟，恐怕还是昨天、甚至前天的七点钟。要它有什么用？"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "speakerEntry": "e_fanghongjian",\r
     "text": "（正经）有用。它告诉你：时间这东西，本来就靠不住。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（忽然笑）我告诉你个秘密。你说话以前，嗓子里唏哩呼噜，跟它打的时候发条转动的声音，非常之像。你是这钟变出来的妖精。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "speakerEntry": "e_fanghongjian",\r
     "text": "（也笑）胡说。我比它强——我每点钟不慢。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "你慢。你干什么都慢半拍。起床慢，出门慢，连吵架都慢。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "speakerEntry": "e_fanghongjian",\r
     "text": "那正好，配它。咱们家两个慢的，凑一对。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（端详那钟）你说，它会不会哪天忽然不走了？"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "speakerEntry": "e_fanghongjian",\r
     "text": "不走更好，就当个摆设——反正它走，也跟不走差不多。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（看看自己的手表）我的表快，你的钟慢。这个家，一个人一个时辰。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "speakerEntry": "e_fanghongjian",\r
     "text": "那才好。你的时辰到了，我的时辰还没到，咱们就永远碰不上“来不及”三个字。"\r
    },\r

     "kind": "narration",\r
     "text": "两个人都笑了。厨房里的娘姨听见小两口笑成一片，探出头来，也跟着笑。这钟从此就在橱上住着，每隔一阵，慢条斯理地当、当打几下，打的永远是七分钟前的钟点。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（笑够了，忽然说）其实慢点也好。外面的世界那么快，快得人心里慌。咱们家里，慢七分钟，怕什么。"\r

    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（隔着香水味，指挥）方先生，这一栏《主妇须知》，明天要交。什么“酱油上浇了麻油就不会发霉”之类，多找几条，读者爱看。"\r
    },\r

    },\r

     "kind": "narration",\r
     "text": "这天，[[NPC1]]忽然把他叫到副刊室，关上门，做出一副法国式的神秘表情。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（压低声音）他躲起来了。他名气太大，日本人跟南京伪政府全要他出来做事。你别讲出去。"\r

    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（听不懂，也不在乎）方先生，你太年轻了。女人家，只管好家务，看好丈夫，就是爱国。"\r

    },\r
    {\r

    },\r

     "kind": "narration",\r
     "text": "她说的“一个”，两个人心里都明白是谁——{{e_tangxiaofu|唐晓芙}}，那个在雨天里退回了整匣信的人。方鸿渐不接话，低头去翻报纸。"\r

     "speakerEntry": "e_fanghongjian",\r

     "text": "冬至，儿子儿媳要回老人家吃饭。下午[[NPC1]]回来，脸色不对，一路无话。[[NPC2]]问他，他只说：到了那边再说。"\r

     "text": "老人家的堂屋里，圆台面摆开，团子、祭祖的菜，一样不少，红烛高照。上过供，才轮到活人入座。[[NPC3]]穿着团花马褂坐上首，[[NPC4]]忙里忙外。二房三房也都到了，{{e_ernainai|二奶奶}}和{{e_sannainai|三奶奶}}一边一个帮着布菜，嘴上客气，眼里打量。孩子们围着桌角抢团子。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "儿媳从家里带来两个菜，说是娘姨的拿手菜，孝敬公婆。[[NPC4]]伸筷子尝了一口，就放下了。"\r

     "slot": "NPC3",\r
     "text": "（呷了口酒，缓缓）冬至大如年，一家人齐齐整整，比什么都强。你们也要常回来，别叫人说我儿子娶了媳妇忘了娘。"\r
    },\r

     "kind": "dialogue",\r
     "slot": "NPC2",\r

     "slot": "NPC3",\r

     "kind": "dialogue",\r

     "text": "二奶奶笑着打圆场：大哥是有骨气的人，慢慢再找；三奶奶小声嘀咕：骨气能当饭吃，倒好了。"\r

    },\r
    {\r

     "text": "[[NPC2]]只当没听见，把那筷子团子放回了碗里。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（梗着脖子）饭碗要紧，骨气也要紧。那种地方，待下去就是帮凶。"\r

     "text": "（忙截住）行了，大过节的，说这些做什么。（给儿子使眼色）还不给你爸认个错。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC3",\r
     "text": "（余怒未息）为人做事，第一要稳。不稳，百事都落空。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC2",\r
     "text": "（慢慢放下筷子，又快又脆）爸说得对，饭碗金贵。只是这饭碗怎么丢的，您得问问——是谁先容不下人。"\r

     "text": "（门里，声音不高）男人像小孩子一样，不能 spoil 的。你太依顺他。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC4",\r
     "text": "他这个人，本领没有，脾气倒很大。你呀，要拿得住他。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "他在楼梯口站住了，进不是，退不是，脸上火烧一样，故意放重脚步，推门进去。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "屋里立刻换了话题。姑母上上下下打量他，像打量一件次品。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC4",\r
     "text": "（皮笑肉不笑）回来了？厂里缺个人，你倒合适，就是怕屈了你的大才。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（硬邦邦）不敢当。我这人，干不了受人恩惠的事。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "姑母抱着狗走了，眼风扫过他，像扫过一件旧家具。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "门一关，[[NPC2]]收拾茶杯，不说话。他一肚子气没处出，抓起帽子又出门。瞎转了两条街，一摸口袋——钱袋丢了。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "饿着肚子回家，已经八点多，饭菜早收了。[[NPC3]]在厨房收拾，探头看了一眼，没作声。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（进门就嚷）背着我，教你怎么拿捏丈夫！"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC2",\r
     "text": "（头也没回）姑母是长辈，来看侄女。倒是有人，在门口偷听，算什么？"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "我偷听？我回自己家，倒成了偷听！"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（火起）我的饭呢？"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC2",\r
     "text": "（从里间出来，冷）谁知道你回不回来？等到七点半，菜凉了，只好收。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "收了？我饿着，你们倒吃得饱饱的！"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC2",\r
     "text": "（又快又脆）你饿了，怪谁？你去哪儿逛了？怎么不说一声？"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "我出去还要向你请假？我连出去的权利都没有了？"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC2",\r
     "text": "（声音拔高）我上班，养这个家；你辞职，跟谁商量了？如今倒好，还要上我姑母的门去讨差事——"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "谁要讨她的差事！我宁可饿死，也不看她那张脸！"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC2",\r
     "text": "（逼近一步）去年你浪荡在上海没有事，跟着{{e_zhaoxinmei|赵辛楣}}算到了内地；内地的事丢了，靠赵辛楣的提拔到上海；上海的事又丢了，现在还想再到内地投奔赵辛楣去。你自己想想，一辈子跟住他，咬住他的衣服——你不是他的狗是什么？你不但本领没有，连志气都没有！"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "这句话戳到骨头里。他血往上涌，伸手猛推了她一把。她踉跄撞到桌角。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "[[NPC2]]站稳，眼睛红了，抓起梳妆台上那把{{e_xiangyashu|象牙梳子}}，用尽力气朝他掷去——正打中左颧，折成两段。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC2",\r
     "text": "（嘶声）你是个 Coward！Coward！Coward！我再不要看见你这个 Coward！"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC3",\r
     "text": "（从厨房冲出来，护住小姐）姑爷，你怎么动手打人？做男人打女人！老爷太太没打过你——我从小喂你吃奶，用气力拍你一下都没有，他倒动手打你！"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "她说着就去摇电话，哭着喊：接姑太太家！他左颧骨火辣辣的，站在屋子当中，觉得这家里没有一寸地方是他的。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（慢慢地转门钮，停了一停，让门外偷听的人得讯走开）我出去了。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "门在身后轻轻关上。梳子的两段还躺在地上，一段压着一段，像两口小小的棺材。"\r
    }\r
   ],\r

   "segments": [\r

     "kind": "narration",\r
     "text": "姑爷{{e_fanghongjian|方鸿渐}}摔门出去之后，屋里静了一瞬，接着是小姐{{e_sunroujia|孙柔嘉}}的哭声。[[NPC1]]从厨房扑出来，一把抱住小姐，上上下下地摸。先前在厨房里，她听见梳子砸在墙上的声响，心就提到了嗓子眼。"\r

     "text": "（急）他打你什么地方？打哪儿了？让我看看！"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "speakerEntry": "e_sunroujia",\r

    },\r

     "slot": "NPC1",\r
     "text": "（对电话，带哭腔）姑太太！您快来罢！姑爷动手打小姐了！……对，就现在，东西摔了一地！您叫汽车开快些！"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "挂了电话，她还是不放心，又烧了热水，拧了把热毛巾，给小姐敷眼睛。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "不到半个钟头，{{e_lutaitai|陆太太}}的汽车到了楼下，高跟鞋一路响上来，怀里那条小狗 Bobby 也跟着汪汪直叫。"\r

     "speakerEntry": "e_lutaitai",\r
     "text": "（进门就搂住侄女）我早说过！我早说过这人靠不住！走，跟我回去，今晚就搬！（回头吩咐）快，给小姐倒杯热水。"\r

     "speakerEntry": "e_sunroujia",\r

     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（应一声，手脚麻利地拖出箱子）早该走！小姐，衣裳、首饰、你的书，一样不留。他的东西，咱们一根线也不拿！"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（一边叠衣裳一边念）这件旗袍是姑太太送的，带。这本书是小姐的，带。陪嫁的单子在我这儿，一样一样，我都记着呢。"\r
    },\r

     "kind": "narration",\r

     "segments": [\r
      {\r
       "kind": "narration",\r
       "text": "方鸿渐是江南乡绅之子。父亲方遯翁是前清举人，早早给他订了周家的女儿；未婚妻没过门就病故，他一篇辞气凄婉的唁信，换来岳父周经理两万块留学费。欧洲四年换了三个大学，兴趣颇广，心得全无，最后花三十美金从旧杂志广告上的“克莱登大学”买回一张哲学博士文凭，心安理得地登上了回国的船。"\r
      },\r
      {\r
       "kind": "narration",\r
       "text": "一九三七年七月，法国邮船白拉日隆子爵号切开印度洋的热浪。三等舱甲板上，中葡混血的鲍小姐是全船男人的去处——男学生背后叫她“局部的真理”。她走到栏杆边向方鸿渐借火，海风里两根人头碰着头，烟点着了，她的嘴唇也碰上了他的。"\r
      },\r
      {\r
       "kind": "quote",\r
       "entry": "e_baoxiaojie",\r
       "text": "方先生，你教我想起了我的 fiance——你相貌和他像极了！"\r
      },\r
      {\r
       "kind": "narration",\r
       "text": "躺椅上的苏文纨把这一幕看在眼里。这位里昂回来的女博士孤高惯了，早把爱情锁在箱底，眼看老同学被人抢先去，反倒打定了主意：航程还长，她要给他一个亲近自己的机会，让他先卑逊地仰慕，再屈伏地求爱。"\r
      },\r
      {\r
       "kind": "narration",\r
       "text": "船泊西贡两夜。头一夜，两人在甲板上走了一圈又一圈，她在没有灯的船尾抢了一个吻，临走又好像不经意地丢下一句话。当夜，她摸进了他的房舱。"\r
      },\r
      {\r
       "kind": "quote",\r
       "entry": "e_baoxiaojie",\r
       "text": "咱们俩今天都是一个人睡。"\r
      },\r
      {\r
       "kind": "narration",\r
       "text": "第二天上午，侍者阿刘铺床捡到三只发钗，拖泥带水的广东官话里开价三百法郎。上岸吃西餐，菜糟得难以下咽，方鸿渐一句“信教的怎么做医生”惹她动了真气。这一顿饭吃掉了三百法郎，也吃掉了甲板上的热乎气——回船以后，她见了他，话一天比一天少。"\r
      }\r

     "segments": [\r
      {\r
       "kind": "narration",\r
       "text": "靠岸前最后两天，鲍小姐变了脸。她忽然跟苏文纨勾着手寸步不离，亲热得像十几年的姊妹；方鸿渐凑上去约下船之后再见面，写信不行，电话也不行，被她客客气气地挡了回来。"\r
      },\r
      {\r
       "kind": "quote",\r
       "entry": "e_baoxiaojie",\r
       "text": "算船上的事呀。船上的事，船上毕。"\r
      },\r
      {\r
       "kind": "narration",\r
       "text": "船靠香港码头，她提着裙子跑下跳板，扑进一个半秃顶、戴大眼镜的黑胖子怀里——正是出钱供她留学的未婚夫李医生。方鸿渐在甲板上从头看到尾，这才听懂那句“你像我的未婚夫”：原来那不是情话，是广告。下船前，侍者阿刘还晃着三只发钗来讨酒钱，她眼迸火星，扭头钻进汽车，再没有回头。"\r
      },\r
      {\r
       "kind": "narration",\r
       "text": "船离香港五六天，苏文纨的机会来了。她嫌他的手帕脏，劈手夺过去洗；又拿出针线包替他钉衬衫钮扣，针脚又细又密。方鸿渐捧着这些干净衣物，像捧着一叠借据——她每钉一个钮扣，他良心上就增一分向她求婚的责任。这份“善意的独裁”，独裁得叫人害怕。"\r
      },\r
      {\r
       "kind": "quote",\r
       "entry": "e_suwenwan",\r
       "text": "拿我的去。拿去，别推，我最不喜欢推。"\r
      },\r
      {\r
       "kind": "narration",\r
       "text": "八月九日到上海，方鸿渐住进周家，在点金银行挂了个名义。周家早把他的博士照登在《沪报》上，“各大机关正争相礼聘”——那张三十美金的文凭头一次变成铅字，他捧着报纸，像捧着一张自己的通缉令。晚饭桌上，周太太一口一个“本钱”，要认他未来的媳妇做干女儿；小舅子效成又当众点破：他把船上那位女博士的照片，看了整整三遍。"\r
      },\r
      {\r
       "kind": "narration",\r
       "text": "挂名女婿心里有本账：出洋的钱是周家的，这碗饭是有价钱的，价钱就是他这个人。夜里他睡在未过门就病故的未婚妻房里，梳妆桌上，她的遗容正对着他的博士照。对着这两张相片，他才肯承认：那篇感动岳父的唁信，悼念的从来不是她，是他自己那点可怜的才情。"\r
      }\r
     ]\r

       "text": "回到故乡，父亲方遯翁率全家到车站迎接，吕校长登门请他到县立中学演讲。上台那天早上，他穿错了三弟凤仪的大褂，讲稿落在家里，只好信口胡扯。"\r

       "text": "海通几百年来，只有两件西洋东西在整个中国社会里长存不灭：一件是鸦片，一件是梅毒！"\r
      },\r
      {\r
       "kind": "narration",\r
       "text": "满座哗然。做记录的女生不知这句该不该下笔，吕校长咳得像一台漏气的风箱，抢上台替他圆场。第二天报纸登出消息，标题客气，字眼刻薄；前阵子踏破门槛的媒人，一个个进来把庚帖要了回去。"\r

       "text": "媒人散净没多久，八一三的炮声就到了，全家逃难去上海。方鸿渐望着车窗外烧起来的半边天，倒觉得出丑不是什么大事——国都要破了，谁还记得一个博士讲过梅毒呢。"\r
      }\r

      {\r
       "kind": "narration",\r
       "text": "一九三八年的春天，上海租界照样热闹。逃难来的人多了，饭局和媒人一起多起来。周太太作媒，把方鸿渐送进张公馆相亲：买办张吉民满口洋泾浜，管太太叫 headache；念佛的张太太盘问家世；张小姐的书架上，端端正正摆着《怎样去获得丈夫而且守住他》。饭后一桌麻将，方鸿渐赢了近三百块，还掏出小本子，一笔一笔认真收账。张家三口当晚判他死刑：气量太小，把钱看得太重。他倒无所谓——妻子如衣服，赢的钱正好买那件看中已久的獭绒外套。"\r
      },\r
      {\r
       "kind": "narration",\r
       "text": "亲事吹了，春天却挡不住。方鸿渐白天昏睡，夜里失眠，想起同船回国的女博士苏文纨：有头脑，有身份，是最理想的女朋友——他自信两人的情谊像两条平行线，再近也合不拢。可女朋友不是情人。他决定去苏家花园看看她。"\r
      },\r
      {\r
       "kind": "narration",\r
       "text": "苏家花园里，苏文纨领出表妹唐晓芙：圆脸，浅酒涡，不烫头，不擦口红，政治系的女学生。方鸿渐心里咯噔一下——摩登文明社会里那桩罕物：一个真正的女孩子。她喊他『同学老前辈』，他抗议说，再叫前辈，自己就像史前原人的遗骸了。"\r
      },\r
      {\r
       "kind": "narration",\r
       "text": "随后进门的是赵辛楣，报馆编辑，苏文纨二十年的旧交，高大轩昂，烟斗衔在嘴里。他把方鸿渐从头到脚验了一遍货，话里带刺；方鸿渐也不示弱，回敬得又快又俏。"\r
      },\r
      {\r
       "kind": "quote",\r
       "entry": "e_zhaoxinmei",\r
       "text": "从我们干实际工作的人的眼光看来，学哲学跟什么都不学全没两样。"\r
      },\r
      {\r
       "kind": "quote",\r
       "entry": "e_fanghongjian",\r
       "text": "那么，得赶快找个眼科医生，把眼光验一下。"\r
      },\r
      {\r
       "kind": "narration",\r
       "text": "苏文纨坐在中间，给这个添茶，给那个递点心，把两个男人摆在天秤两头，砝码添添减减，秤杆始终平平。沙龙里还有刚从法国回来的沈氏夫妇，香水熏得方鸿渐把喷嚏忍成咳嗽。赵辛楣看在眼里，酸在心里：他认得苏文纨二十年，从没得过她送出门；这个同船回来的博士，才来几天。倒是苏文纨随口一提，说峨嵋春的川菜地道，方鸿渐当场揽下做东——谁也没料到，这顿饭成了往后许多事的由头。"\r
      }\r
     ]\r

       "text": "峨嵋春川菜馆，方鸿渐订了一桌，请的是表姐妹两位。苏文纨临时称病，又连环打电话来搅局；唐晓芙偏要来，一个人掀帘进门，吃得额头冒汗，直呼痛快。两人谈得投机，说到通讯，她最恨电话——"\r
      },\r
      {\r
       "kind": "quote",\r
       "entry": "e_tangxiaofu",\r
       "text": "电话是偷懒人的拜访，吝啬人的通信。最不够朋友！"\r
      },\r
      {\r
       "kind": "narration",\r
       "text": "方鸿渐当场表态：朋友间宁可写信，决不通电话。他要来她的住址，端端正正写在随身一本书的空页上。此后他成了唐家书房的常客：谈留学，他说出洋好比出痘子，出过一回就该把它忘了；谈新诗，两人一起笑话苏文纨身边那位剑桥回来的诗人曹元朗——脸圆得像大阿福，诗念出来，中国字夹着外国字，谁也不认得谁。"\r

       "kind": "narration",\r
       "text": "祸事出在苏家的一次雅集。曹元朗朗诵完他的《拼盘姘伴》，苏文纨取出一把折扇请众人品题——扇上一首情诗，落款是青年政客王尔恺。扇子传到方鸿渐手里，他越看越眼熟，脱口而出："\r
      },\r
      {\r
       "kind": "quote",\r
       "entry": "e_fanghongjian",\r
       "text": "不得了！这首诗是偷来的。"\r

      {\r
       "kind": "narration",\r
       "text": "他的考据没错：诗的本家是德国十五六世纪的民歌，翻成中文，换了件长袍马褂。可他骂错了人——诗不是王尔恺做的，是苏文纨自己的得意之作，请人题上扇面，装装门面。方鸿渐写了封之乎者也的请罪信，又登门探口风；唐晓芙笑得直不起腰，把真相告诉了他，末了送他一句话：信，别写了；人，可以常来。"\r
      }\r

       "kind": "narration",\r
       "text": "赵辛楣在他的公寓做东，请了哲学家褚慎明、旧体诗人董斜川，还有方鸿渐和苏文纨。褚慎明管罗素叫 Bertie，转述他的英国古话：结婚仿佛金漆的鸟笼，笼外的鸟想住进去，笼内的鸟想飞出来。苏文纨接了一句法国谚语——"\r

      {\r
       "kind": "quote",\r
       "entry": "e_suwenwan",\r
       "text": "不说是鸟笼，说是被围困的城堡，城外的人想冲进去，城里的人想逃出来。"\r
      },\r
      {\r
       "kind": "narration",\r
       "text": "满座咀嚼这句话时，谁也没料到它往后的应验。那晚赵辛楣存心灌方鸿渐的酒，想看他当众出丑；方鸿渐果然醉得扶着墙吐。可成功只证实了失败：苏文纨亲自叫车，把他送了回去。赵辛楣站在公寓门口，夜风一吹，酒全醒了——他认识她二十年，她从没送过他。"\r

      {\r
       "kind": "narration",\r
       "text": "四月十五，月圆得过分。苏文纨支开佣人，邀方鸿渐走进花园的六角亭，把一句命令藏进外国话里：Embrasse-moi。方鸿渐俯身吻了她，轻得像一片树叶落水；心里想的，却是另一张圆脸、两个酒涡。当夜他写了绝交信，又抓起电话，躲进法文里摊牌，换来一声『你这个浑蛋』。也是这一夜，一封错字连篇的电报从内地发来：三闾大学聘他当教授，月薪三百四十元。"\r
      },\r
      {\r
       "kind": "narration",\r
       "text": "苏文纨的报复比电报更快。周家的挂名岳父、船上的鲍小姐、三十美金的文凭，一样一样，先到了唐晓芙耳朵里。方鸿渐的表白信一封封石沉大海；他冒雨登门，唐晓芙站在门里，把他的过去一条一条数出来，又退回那只装信的朱古力糖匣子。"\r
      },\r
      {\r
       "kind": "quote",\r
       "entry": "e_tangxiaofu",\r
       "text": "我爱的人，我要能够占领他整个生命，他在碰见我以前，没有过去，留着空白等待我。"\r
      },\r
      {\r
       "kind": "narration",\r
       "text": "门关上了。他在雨里站了很久，没有回头；门后的人贴着门板，也站了很久。只要他再敲一次门——他没有。唐晓芙在退回的信里发现，信封撕破了，又用玻璃纸一点一点衬补好；她写地址的那一页，他剪下来留着。她病了一场，随父亲去了香港，转重庆；匣子压在箱底，不打开，就不算完全破裂。苏文纨则答应了曹元朗的第四次求婚。沪上这一场情场，散的散，走的走，只剩那座公寓里的酒宴，灯还亮着。"\r

       "text": "夜里甲板上，赵辛楣警告方鸿渐提防孙柔嘉，又大发议论，说男人对女人只肯借书不肯送书，一借一还便是两次接触。他们不知道，暗处那个怯生生的姑娘，把每个字都听了去。"\r

       "text": "谈到择偶，赵辛楣宣布宁可娶个老实简单的乡下姑娘，让他舒舒服服做她的 Lord and Master——这标准，是照着苏文纨反着写出来的。"\r

       "text": "女人不带，铁箱也不带。军车拉的是军粮弹药，不是家当。"\r
      },\r
      {\r
       "kind": "narration",\r
       "text": "南城的汽车上，一个油脸汉子拿米袋占座，赵辛楣为晕车的孙柔嘉争回半个座位。后座上，李梅亭又去勾搭那位新寡的苏州女人，被她的男仆阿福撞破，“猪猡骂我”“我骂猪猡”，一车人看足了戏。"\r
      },\r
      {\r
       "kind": "narration",\r
       "text": "到了吉安，学校的汇款躺在中央银行里，银行非要本地铺保不可。名片递进去被退回来，教育局长把他们当骗子。五个人饿得前胸贴后背，方鸿渐却在后街撞见李梅亭背着人偷吃烤山薯，嘴角乌黑，还说是替大家尝尝有没有毒。"\r
      },\r
      {\r
       "kind": "narration",\r
       "text": "末了，是一路不声不响的孙柔嘉揣着贴方帽照相的毕业文凭出门，寻到妇女协会的女同志，由人家在公路局的男友作了保。款子当天就领出来了。"\r

       "kind": "quote",\r
       "entry": "e_sunroujia",\r
       "text": "您担的干系，是一笔取得出的钱；我们担的，是五条命。"\r
      },\r
      {\r
       "kind": "narration",\r
       "text": "赵辛楣大笑，说这顿饭头一碗该敬她。她低头扒饭，耳根红了——是害羞还是得意，连她自己也说不清。"\r
      }\r

       "text": "过了吉安，孙柔嘉在界化陇的山店里病倒了。李梅亭箱里明明有没拆封的仁丹，摸了半天，给她的是开了封的鱼肝油丸。她躺着想家，想这三千里外举目无亲，偷偷哭了一场，哭完嘱咐自己：让人看见的眼泪，不值钱。"\r
      },\r
      {\r

       "text": "再往前，一夜宿在坟场边的火铺。半夜她梦魇，带哭嚷着“别压住我的红棉袄”；清晨跟方鸿渐谈鬼，说怕鬼不怕鬼，全看天亮不亮。"\r

      {\r
       "kind": "narration",\r
       "text": "翻山越岭一个多月，方鸿渐一行五人终于到了平成县的三闾大学。学校是本地财主的花园改的，人还没安顿，位子已经乱了。高校长本把中国文学系主任许给李梅亭，半路上又收了教育部汪次长的人情，改聘他伯父汪处厚。李梅亭到校当晚的欢迎会，成了新主人的地盘：同事和学生连声叫「主任」，叫的却不是他。汪处厚一画胡子修成电影明星式的一线，握着他的手，好半天搓摩不放。"\r
      },\r
      {\r
       "kind": "quote",\r
       "entry": "e_wangchuhou",\r
       "text": "李先生，你真害我们等死了，我们天天在望你来。"\r
      },\r
      {\r
       "kind": "narration",\r
       "text": "当系主任和结婚一样，先进门三日就是大。李梅亭一篇训话闷在肚里，推头痛早退，回房拍桌大骂。赵辛楣劝他，也替方鸿渐宽心：这学校的人事虽然浑，但你是我面上来的人，万事有我。"\r
      },\r
      {\r
       "kind": "narration",\r
       "text": "第二天就轮到方鸿渐自己。高校长请他到校长室，先惊异地问那封「很重要的信」怎么没收到——抗战时的邮政真该死——然后慢条斯理摊牌：履历上没有学位，教授只好降成副教授，月薪二百八十元，教没人愿意教的论理学。这位昆虫学家出身的校长最会做这种买卖，先把价码压到最低，再把话说成恩典。"\r
      },\r
      {\r
       "kind": "quote",\r
       "entry": "e_gaosongnian",\r
       "text": "我是研究生物学的，学校也是个有机体，教职员之于学校，应当像细胞之于有机体。"\r
      },\r
      {\r
       "kind": "narration",\r
       "text": "方鸿渐走出校长室，灵魂像给蒸气碌碡滚过。电报上白纸黑字的教授，进门矮了半截；他后来才听说，这儿的先生们管这一级叫「如夫人」——扶正两个字，比降职还远。"\r
      }\r
     ]\r

     "segments": [\r
      {\r
       "kind": "narration",\r
       "text": "三闾大学藏不住秘密，倒是养秘密的温室。历史系主任韩学愈的履历最辉煌：美国克莱登大学博士，娶的又是「美国」太太。方鸿渐一听「克莱登」三个字，耳朵里嗡的一声——他自己箱底就锁着同一家「大学」买来的文凭。原来天下买假文凭的，不止他一个；人家的堂皇印在履历上，换来系主任的位子。"\r
      },\r
      {\r
       "kind": "narration",\r
       "text": "韩学愈请方鸿渐到家里吃饭。主人说话少、慢、着力，彷佛每个字都有人担保；喉咙里一个大核，讲话时忽升忽降。两个各怀鬼胎的人隔着饭碗互相试探，方鸿渐故意提起纽约那位爱尔兰人，韩学愈面不改色。"\r
      },\r
      {\r
       "kind": "quote",\r
       "entry": "e_hanxueyu",\r
       "text": "这个人是个骗子。克莱登是好学校，他是这学校里开除的小职员，藉着幌子向外国不知道的人骗钱。"\r
      },\r
      {\r
       "kind": "narration",\r
       "text": "撒谎撒得这样理直气壮，方鸿渐自愧不如。席上那位红头发、满脸雀斑的韩太太口口声声纽约，口音却不像娘胎里带的——她是在中国娶的白俄。这个谜，孙柔嘉早从同屋的小姐那里听了来，转头就讲给方鸿渐听。韩学愈想安插太太进外语系当教授，系主任刘东方不答应，两人闹得差点翻脸。"\r
      },\r
      {\r
       "kind": "quote",\r
       "entry": "e_sunroujia",\r
       "text": "这学校像个大家庭，除非你住在校外，什么秘密都保不住，并且口舌多得很。"\r
      },\r
      {\r
       "kind": "narration",\r
       "text": "刘东方不肯要韩太太，英文总得有人教，苦差落到助教孙柔嘉头上——入学成绩最糟的丁组。学生先抗议她资历浅，又在黑板上写「Beat down Miss S.」，造句造出「我们都是你的丈夫」，把她气哭了。方鸿渐主张这班决不能再教，最后索性自己老着脸接了过来。课是接下了，韩学愈的敌意也接下了：三个历史系的旁听生，正等着看他的笑话。"\r
      }\r
     ]\r

     "cards": [\r

     "segments": [\r
      {\r
       "kind": "narration",\r
       "text": "李梅亭丢了系主任，却捞到一个训导长。新官上任，他把教育部倡导的「导师制」原样搬进三闾：导师跟学生同吃饭，未结婚的先生不得做女学生的导师——全系未婚的只有赵辛楣一个——师生还要通用厕所。校务会议上，有胃病的、家里饭菜有名的、儿女成群的一致反对，数学系主任拿数字把他问倒，方鸿渐更顶了一句「干脆跟学生同床睡觉得了」。最后高校长出来和稀泥，导师制缩水成每星期两顿饭，外加饭前静默一分钟。"\r
      },\r
      {\r
       "kind": "narration",\r
       "text": "方鸿渐自己的讲台也不太平。他代了孙柔嘉的丁组英文，又教没人要的论理学：点名吧，空座位像掉了牙的嘴；讲书吧，材料讲完了铃还不打，只好靠写黑板「杀时间」。毕业没几年，一做了先生就属于前一辈，这种年辈的隔膜，比阶级还分明。"\r
      },\r
      {\r
       "kind": "narration",\r
       "text": "比课堂热闹的是汪家的晚宴。汪处厚的续弦汪太太二十五岁，浅紫旗袍，十指甲全是红的，会画国画，最爱做媒：把女生指导范懿配赵辛楣，把刘东方的妹妹配方鸿渐。高校长不请自来，汪处厚酒酣耳热，发明了一套职称的比方。"\r
      },\r
      {\r
       "kind": "quote",\r
       "entry": "e_wangchuhou",\r
       "text": "讲师比通房丫头，教授比夫人，副教授呢，等于如夫人——姨太太要扶正做大太太，那是干犯纲常名教，做不得的。"\r
      },\r
      {\r
       "kind": "quote",\r
       "entry": "e_wangtaitai",\r
       "text": "你们新回国的单身留学生，像新出炉的烧饼，有小姐的人家抢都抢不匀呢。"\r
      },\r
      {\r
       "kind": "narration",\r
       "text": "媒没做成，戏倒不少。饭后送女客，范懿过溪险摔一交，又「丢」了手提袋，一路费尽心机挨着赵辛楣；她借他的剧本，扉页写着「To my precious darling」——后来孙柔嘉点破，这行字多半是她自己描的。孙柔嘉自己也有人追：历史系的陆子潇，情书一封比一封省事，末了附纸一张，同意画加号，不同意画减号。她向方鸿渐讨主意，方鸿渐教她把信原包退回，一字不写——那正是唐晓芙当年退他信的老法子。"\r
      }\r
     ]\r

     "segments": [\r
      {\r
       "kind": "narration",\r
       "text": "春假的夜晚，赵辛楣陪汪太太散步。她鼓动他讲情史，他把苏文纨的旧事和盘托出；她警告他，切忌对一个女人说另外一个女人好。两人走回汪家门口，正撞上闻声赶来的高校长和汪处厚——夜色里两个扭作一团的影子，跳到黄河也洗不清。汪太太索性不洗，进客堂挑最舒服的椅子坐下，装疯卖傻，语带双关。"\r
      },\r
      {\r
       "kind": "quote",\r
       "entry": "e_wangtaitai",\r
       "text": "我跟他的关系，我也忘了。你的胆只有芥菜子这么大——就害怕到这个地步！"\r
      },\r
      {\r
       "kind": "narration",\r
       "text": "赵辛楣百口莫辩，「哼」一声走了。当夜他就收拾行李辞职，去重庆投奔朋友，把十几本书留给方鸿渐——其中一册薄薄的《共产主义论》，谁也没想到日后会惹出大祸。这位替方鸿渐撑了一年腰的人一走，孙柔嘉在路上低声说——"\r
      },\r
      {\r
       "kind": "quote",\r
       "entry": "e_sunroujia",\r
       "text": "赵叔叔走了！只剩我们两个人了。"\r
      },\r
      {\r
       "kind": "narration",\r
       "text": "两个人还没来得及细想，闲话先到了：有人写匿名信给她父亲，造他们的谣言。没几天，李梅亭和陆子潇撞见他们挽手同行，起哄问什么时候请喜酒。孙柔嘉不否认，方鸿渐「句句当真」——这桩亲事，就算被满校的舌头促成了。订婚宴上，女客们研究新娘的轮廓，红头发的韩太太举着筷子，连声劝甜菜：Sweets to the sweet。"\r
      },\r
      {\r
       "kind": "narration",\r
       "text": "甜菜吃完，苦的在后头。学期结束，下学期的聘约普遍发出，连韩太太都在敬聘之列，独独漏了方鸿渐。原来陆子潇在他房里翻到赵辛楣丢下的那册《共产主义论》，密报李梅亭，李梅亭呈到校长那里。高校长的判词是「思想有问题」——他本要升方鸿渐一级的，可惜，可惜。韩学愈得到消息，拉了白俄太太在家里跳跃得像青蛙和虼蚤：从此再没人揭他的底了。方鸿渐憋着一封痛骂校政的回信没处发，只好承认，自己像伊索寓言里那只没尾巴的狐狸。"\r
      },\r
      {\r
       "kind": "narration",\r
       "text": "三闾大学这一年，欢迎会开的是别人，聘约谈的是别人，连订婚，都像是在别人的起哄里完成的。"\r
      }\r

      {\r
       "kind": "narration",\r
       "text": "在三闾大学耗完一年，全校的聘约都发出去了，唯独没有方鸿渐的。他本想写一封痛骂校政的信随聘约退回去，如今连寄的地方都没有。离校那天，送行的只有几个学生，高松年倒派听差追来一封信和一份贺他们新婚的礼券。孙柔嘉把信团成一团，扬手丢进山涧的水潭——信脏眼睛，礼券不脏，留着。"\r
      },\r
      {\r
       "kind": "narration",\r
       "text": "在桂林等飞机票的十几天，是两人最后一段无忧无虑的日子。然后飞机上了天，把他们吐得七荤八素，一路吐到香港。赵辛楣来接机，他如今进了国防委员会，还是爱请客的老脾气，在奥国馆子摆了一桌，劝两人赶快注册结婚，不必回上海办仪式。"\r
      },\r
      {\r
       "kind": "quote",\r
       "entry": "e_zhaoxinmei",\r
       "text": "孙小姐这人，很深心。她煞费苦心。……我喝醉了，信口胡说，你不许告诉你太太。"\r
      },\r
      {\r
       "kind": "narration",\r
       "text": "酒到半酣，方鸿渐抛出一套葡萄论：天下只有两种人，一种挑最好的先吃，一种把最好的留在最后，前者只剩回忆，后者还有希望。道理讲完，他自己先认了输——结婚这件事，他原来没多少“希望”可押。"\r
      },\r
      {\r
       "kind": "quote",\r
       "entry": "e_fanghongjian",\r
       "text": "结婚无需太伟大的爱情，彼此不讨厌，已经够结婚资本了。"\r
      },\r
      {\r
       "kind": "narration",\r
       "text": "酒桌上的话，一句是一句。劝婚的话，两人听进去了；那句没头没尾的“煞费苦心”，方鸿渐笑自己多心，按了下去。几天之后，两人按最简单的手续注册结了婚。进城的手续，原来只要半天。"\r
      }\r
     ]\r

     "segments": [\r
      {\r
       "kind": "narration",\r
       "text": "蜜月的刺，是在赵家山上扎下的。拜见赵老太太那天，苏文纨也在——如今的曹太太，时髦丰腴，旗袍花得像欧洲小国的国旗。她当着满座，把声音低得恰好让每个人都听见。"\r
      },\r
      {\r
       "kind": "quote",\r
       "entry": "e_suwenwan",\r
       "text": "这位太太——是不是还是那家什么银行？钱庄？唉，我记性真坏——经理的小姐？"\r
      },\r
      {\r
       "kind": "narration",\r
       "text": "孙柔嘉没接话，方鸿渐红了脸。回到旅馆她炸了：丈夫不替她出头，还替那女人说话。什么大家闺秀，自己有了丈夫，还要跟辛楣勾搭。一袋荔枝把这场风波哄了过去，可“千方百计”四个字，从此埋在她心里，成了一根拔不掉的刺。"\r
      },\r
      {\r
       "kind": "quote",\r
       "entry": "e_sunroujia",\r
       "text": "好容易千方百计嫁到你这样一位丈夫，还敢不小心伺候麽？"\r
      },\r
      {\r
       "kind": "narration",\r

      },\r

      {\r
       "kind": "narration",\r
       "text": "两间小房是方遯翁的面子租的，家具是姑母送的。小家庭刚立起来，夫家的两位弟媳妇就结伴上门“参观”：问租金，问薪水，把陪嫁的家具一样样估价，连厨房那口锅都翻过来看底。孙柔嘉答一句，留三句。她们回去一五一十，都成了老太太耳朵里的新闻。方家恨孙家简慢，孙家厌方家陈腐——爱写日记的老公公后来在日记里叹息：秦晋二国，世缔婚姻，而世寻干戈。亲家相恶，于今为烈。"\r
      },\r
      {\r
       "kind": "narration",\r
       "text": "老公公还送过一只祖传老钟，每点钟慢七分钟，说是镇宅。小两口拿它开了半天玩笑，说它打的永远是七分钟前的钟点。那段日子，锅里是热的，钟是慢的，人是笑的。"\r
      },\r
      {\r

      },\r
      {\r
       "kind": "quote",\r

       "text": "小姐爱吃菠菜的，我要先问问她。"\r
      },\r
      {\r

       "text": "外头，方鸿渐靠赵辛楣介绍进了华美新闻社当资料室主任，实则替沈太太的副刊抄《主妇须知》——“酱油上浇了麻油就不会发霉”，就是他的大作。总编辑王先生是个正人君子，天天骂汉奸；沈太太的丈夫却投靠了南京伪政府，她登报声明“不问政治”，跟着去了南京。这间报馆，后来还欠他一场风波。"\r
      },\r
      {\r
       "kind": "narration",\r
       "text": "孙柔嘉把她看了个透：几十篇文章，其实只有一篇；这种人走了，国家好。话头不知怎么滑到旧人旧事上，她针脚不停，轻轻巧巧戳了他一下。"\r
      },\r

       "entry": "e_sunroujia",\r

      }\r

       "text": "祸是从报馆起的。总编辑王先生因言论激烈被逼辞职，方鸿渐一口气咽不下，跟着辞了——事先一个字没跟孙柔嘉商量。冬至那晚在方家，这件事当着一桌子人砸开。老公公骂他意气用事，婆婆急一家子的嚼用；她带来的两个菜，老太太尝了一口就放下筷子：外头佣人做的菜，油水来历不明。孙柔嘉捏着筷子没吵，只轻轻问了一句：这饭碗是怎么丢的，您得问问，是谁先容不下人。"\r
      },\r

      },\r

      },\r
      {\r
       "kind": "quote",\r
       "entry": "e_sunroujia",\r

      {\r
