 "meta": {\r
  "id": "murder",\r
  "title": "一桩事先张扬的凶杀案",\r
  "subtitle": "全镇都知道，只有他不知道",\r
  "version": 2,\r
  "stamina": {\r
   "start": 8,\r
   "perLevel": 4,\r
   "searchCost": 1,\r
   "completeReward": 1,\r
   "restGain": 2\r
  },\r
  "cardSpec": {\r
   "avg": 700\r
  }\r
 },\r
 "frame": {\r
  "levelIntro": {\r
   "1": [\r
    {\r
     "kind": "narration",\r
     "text": "礼拜一的清晨，天刚蒙蒙亮，牛奶店的灯还亮着。长凳上睡着两个男人，怀里揣着报纸裹着的刀。老板娘站在柜台后头，大气都不敢出。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "河面上传来汽笛声。全镇的人都挤在码头，迎候白衣的主教。船没有停。主教站在船栏旁，朝人群机械地画着十字，就这么过去了。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "广场上的人越聚越多，都站在街对面，望着同一栋阿拉伯式大宅。没人上前，没人出声，像是都在等一件人人都知道要发生的事。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "七点刚过，一个穿白亚麻礼服的年轻人跑过广场，朝自家大门跑去。全镇的人都看见了他，也都看见了等在他家门前的两把刀。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "没有人拦住他，也没有人拦住那两把刀。事后全镇的人都说：我们早就知道了。可知道和拦住之间，隔着一整个小镇的沉默。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "这一切是怎么走到这一步的？得从十一个月前说起——那年八月，一个外乡人乘着礼拜一的班船，来到了这个镇。"\r
    }\r
   ],\r
   "2": [\r
    {\r
     "kind": "narration",\r
     "text": "婚礼极尽铺张：四十只火鸡、十一头猪、两百多箱走私酒。新郎迟到了两个小时，没人见怪——他有全镇都得罪得起的排场。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "深夜，新郎牵着新娘徒步回了娘家。敲门三下，他吻了岳母的脸颊，道了谢，转身离开。门一关，母亲打了女儿整整两个小时。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "凌晨近三点，两个儿子被从床上叫起来。妹妹被提上餐桌，只问了一句：是谁干的。她几乎不假思索，说出了一个名字。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "没有人去核实那个名字是真是假。在这个家里，妹妹的话就是证据，而证据只需要一个名字。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "三点二十，肉市的砂轮响了起来，两把刀在灯前磨得雪亮。磨刀的人逢人便说要杀人，喊得比卖肉还响。听见的有二十二个。"\r
    }\r
   ],\r
   "3": [\r
    {\r
     "kind": "narration",\r
     "text": "天还没亮，消息已经传遍了全镇：他们要杀他。卖肉的听见了，送奶的听见了，镇长听见了，神父也听见了。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "人人都以为自有别人去管。老板娘托了修女，修女带话给神父，神父转身想着主教要来，忘了。镇长收走了刀，觉得万事大吉，接着睡他的回笼觉。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "而那个要被杀的人，此刻正睡得安稳。五点半他起了床，把从不离身的手枪卸下子弹收进抽屉，换上一件没浆洗的白色亚麻礼服。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "六点零五，他从平日闩死的正门出了门。门底下躺着一封信，写明谁要杀他、在哪、为什么。他跨了过去，没有看见。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "河上的汽笛响了，全镇都去迎主教的船。他挤在人群前排，笑着盘算自己圣诞的婚礼。距离七点，还剩最后一段路。"\r
    }\r
   ],\r
   "4": [\r
    {\r
     "kind": "narration",\r
     "text": "二十多年后，一个中年人回到了镇上。镇子变了样，码头冷清了，歌舞厅关了门，只有教堂的钟还按老时候敲。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "他是死者生前最要好的朋友。案发那天他宿醉未醒，被妹妹从床上喊起来，听到的第一句话是：他们把他杀了。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "他去翻法院的档案。档案室漏了水，案卷泡烂了大半，三百多页预审报告只剩下些散页。法官当年写在页边的旁注，字迹却还认得。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "他一家一家地敲门。解梦的母亲卧在吊床上，把他认成了死去的儿子；厨娘临死前说出了那个清晨她咽回去的话；行凶的兄弟俩，各自活成了两种下场。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "每个人的余生都等着被清点。而那个被退回的新娘，在荒村的窗前绣了十七年的花——她的故事，是这桩凶案唯一的温柔出口。"\r
    }\r
   ]\r
  },\r
  "ending": {\r
   "title": "尾声 · 全镇都知道",\r
   "segments": [\r
    {\r
     "kind": "narration",\r
     "text": "案子判了。兄弟俩在法庭上只认一句话：是为了名誉。杀人偿命的律条，在这四个字面前让了步。候审三年，他们走出了镇监狱。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "出狱后，哥哥娶了等了他三年的未婚妻，洗手做了首饰匠；弟弟再入伍，走进游击区，从此再没人见过他。牢里搓洗了三年也洗不掉的那股气味，跟着他们各走各的路。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "死者的家塌了。母亲普拉西达卧在老宅的吊床上，嚼着独行菜籽，把上门的故人认成儿子，逢人只说：他就是我的命。那扇正门再没开过，镇上人管它叫死亡之门。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "被改变的人远不止这些：有人看见幻象发了疯，有人受惊落下终身的病根，有人八十六岁高龄想起那个清晨，活活吓死。死的是一个人，偿命的却是全镇。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "speaker": "维多利",\r
     "text": "（临死前，她拉住来采访的人）天没亮就有人来告诉我了……可我把话咽了回去。他爹当年欠我的，我一直记在他儿子头上。这么多年，我没有一天睡得安稳。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "预审法官翻遍案卷，找不到死者有罪的一丝证据。他在页边写：给我一个偏见，我将撬动地球。又写：宿命让我们隐遁无踪。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "真正杀了人的，也许不是那两把刀。全镇提前三个钟头就知道了，人人都以为自有别人去管。刀落下之前，沉默已经先动了一次手。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "只有安赫拉的故事有个出口。被退回的新娘，后来反而爱上了退她的人。一周一封信，写了十七年，近两千封，一封回音都没有。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "speaker": "圣罗曼",\r
     "text": "（八月的一个午后，他背着背囊走进绣花的屋子，把背囊放上绣花机）好吧，我来了。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "他带回的箱子里，近两千封信按日期码放整齐，绸带捆好，一封都没拆过。小镇的日子照旧往下过，牛奶店的灯天黑还会亮。二十七年后，那个回乡的人把这一切写成了报道——就是这篇故事。"\r
    }\r
   ],\r
   "credit": "一桩事先张扬的凶杀案 · 改编自加西亚·马尔克斯同名小说 · 幻光文游"\r
  }\r
 },\r

   "segments": [\r
    {\r
     "kind": "narration",\r
     "text": "去年八月的一个礼拜一，班船冒着白烟靠了岸。这地方平日没什么新鲜事，船一靠岸，半个镇的人都涌到河边看热闹。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "外乡人提着两口皮箱下船，箱子上贴着花体字的行李签，一笔一画誊写得齐齐整整，像印出来的。他自称机车工程师，说是来这一带看看修铁路的差事。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "两口皮箱沉得很，扛箱子的脚夫累得直喘，他给的赏钱却叫人眉开眼笑。有人凑上去搭话，他句句都答，又句句都没答到根上。有细心人数过，他下船那一袋烟的工夫，光是赏钱就撒出去七八回。"\r
    },\r
    {\r
     "kind": "narration",\r

    },\r

     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（把一枚硬币抛给扛箱子的小孩）拿着，买糖去。这镇子不错，我喜欢。"\r
    },\r

     "kind": "dialogue",\r
     "speaker": "玛格达莱纳",\r
     "text": "（抢着跟围观的人讲）我跟他同船来的，你们是没瞧见——海上风浪那么大，太太小姐们都吐得抬不起头，就他站在甲板上给大家讲笑话，逗得满船人直乐。"\r

     "speaker": "玛格达莱纳",\r

    },\r
    {\r
     "kind": "dialogue",\r
     "speaker": "玛格达莱纳",\r

   "segments": [\r
    {\r
     "kind": "narration",\r
     "text": "九月末的一个午后，天热得人发昏。外乡人在他租下的那栋小楼门厅里打盹，躺在摇椅上，一把大蒲扇盖着脸。门厅的窗正对着{{e_guangchang|教堂广场}}，从摇椅上望出去，广场上的一举一动都看得清清楚楚。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "广场上静悄悄的，只有麻雀在啄食。这时候，一个姑娘挎着篮子，随她母亲从广场那头走过来。姑娘约莫十八九岁，辫子垂在腰后，走得不快，风把裙角撩起来一点，她伸手按了按。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "篮子里是新扯的衣料和几轴线。娘儿俩一路走，一路说着过几天募捐晚会的事。姑娘挑了半日线，才定下一块水红的。母亲催她走快些，姑娘却磨磨蹭蹭，眼睛瞟着广场边的花摊。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（半睁着眼，含糊地）那是谁家的姑娘？"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（扇子底下的声音懒洋洋的）长得倒俊。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "房东太太探头看了一眼，报了那家的家门：镇上最本分不过的人家，父亲是个瞎了眼的金匠，母亲管教女儿出了名地严，这姑娘是家里最小的女儿，还没许人。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（扇子底下含含糊糊）没许人……好。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "房东太太又补了一句：那家人门槛高，姑娘们轻易不出门的。他听了，只在扇子底下笑了一声。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（像是自言自语）门槛高好啊。我这个人，就喜欢爬高门槛。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "摇椅吱呀吱呀晃了两下。就在房东太太转身要走的时候，摇椅上的人忽然又开了口，声音清清楚楚，半点不像刚睡醒。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（闭着眼）等我醒了，请提醒我，我要娶她。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "房东太太愣在门口，当他说梦话，笑着摇头。可他一点儿不像开玩笑，说完这句话，把蒲扇往脸上一拉，当真又睡熟了。她在这门厅里迎来送往十几年，头一回听见有人这么提亲。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（迷迷糊糊补一句）就这么定了。"\r
    },\r

     "text": "多年以后，房东太太还跟人念叨这一幕。她说那姑娘的名字起得真好——好到让一个外乡人半睡半醒之间，就把自己的后半辈子定了下来。而姑娘自己还不知道，她挎着篮子走过的那几步路，已经被人记了一辈子。打这天起，姑娘家再严的门规，也拦不住一个打定了主意的外乡人。"\r

     "text": "我到这镇子，是从{{e_matou|码头}}下的船。八月的太阳毒，班船一个礼拜才来一趟，我提着两口皮箱，半个镇的人都来看我。可我一眼就喜欢上这儿了——地方小，人心热，河边的风里有股甜味。人家问我来干什么，我说修铁路。其实干什么不要紧，要紧的是我想留下来。"\r

     "text": "婚礼上我一直在笑。对宾客笑，对{{e_shengroman|圣罗曼}}笑，对每一个来敬酒的人笑。嘴角都笑酸了，还得笑。烤肉的香味熏得人发晕，可我一整天没吃下几口东西。人人都在夸，说新娘子多俊，多有福气。福气——我捏着扇子，心里一遍一遍地数：还有几个钟头天黑。"\r

     "text": "那个秘密，我藏了好些年。在这个镇上，姑娘家的名声就是命。母亲的戒尺，父亲的叹气，一大家子的眼睛，把我教成了这副模样。小时候我问母亲，姑娘家为什么守这么多规矩，她说，等你嫁人就明白了。如今我要嫁人了，还是不明白。我不怨谁。怨也没用，命就是这样。"\r

     "text": "吃过晚饭，年轻牧场主陪着未婚妻{{e_fuluola|弗洛拉}}在广场上绕圈。晚风正好，教堂的钟刚敲过。话题绕来绕去，总绕不开那个刚到镇上的外乡人。"\r

    },\r

     "speakerEntry": "e_fuluola",\r

    },\r

     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "请！八桌都请。到时候让你妈坐上首，谁也别想挑理。日子我都掐着指头数着呢——来年圣诞，一天不多，一天不少。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "speakerEntry": "e_fuluola",\r
     "text": "数吧数吧，数岔了日子，看我不收拾你。（顿了顿）那外乡人要在镇上长住，往后你们少不了打交道。"\r
    },\r
    {\r

     "slot": "NPC1",\r

    },\r

    },\r

   "segments": [\r

     "kind": "dialogue",\r

    },\r
    {\r
     "kind": "dialogue",\r

   "segments": [\r
    {\r
     "kind": "narration",\r
     "text": "凌晨四点二十，婚礼的喧闹才散。[[NPC3]]从后门摸回家，和衣倒下就睡。厨房里，[[NPC1]]已经起来了，剁刀落在砧板上，咚，咚，咚。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "五点钟，讨奶的妇人挎着空桶上门，讨了半碗热奶，又压着嗓子，带来一个消息。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "speaker": "讨奶乞妇",\r
     "text": "（凑到灶台边，声音发紧）行行好，赏口热奶再走。……还有句话，厨娘，你听了可别声张——屠户家那两兄弟，揣着刀，正满镇找你们家少爷，说要杀了他。"\r

    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC2",\r
     "text": "（追出门半步，又缩回来）妈，那咱们去报官？去找镇长？"\r
    },\r
    {\r

     "slot": "NPC1",\r
     "text": "（冷笑）报官？官老爷管的是体面人的事，几时轮得到你我。干活。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "女儿盯着母亲的背影看，母亲没再说话。许多年前，这家的老爷{{e_laona|老纳}}把她哄上了手，转头又把她丢进厨房当佣人，一丢就是半辈子。那句警告在她喉咙里滚了一圈，到底还是咽了回去。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（低声，像说给自己听）各人有各人的命。"\r
    },\r

     "kind": "narration",\r
     "text": "六点多，[[NPC3]]睡眼惺忪地下楼，正撞见她把剁开的兔子开膛，热气腾腾的内脏一把扔给了狗，狗抢作一团。"\r
    },\r

     "kind": "dialogue",\r
     "slot": "NPC3",\r
     "text": "（皱起眉，后退半步）别那么野蛮。你就想想，假如它是个人。"\r

     "slot": "NPC1",\r
     "text": "（把刀往砧板上一插）少爷，畜生就是畜生。想多了，肉就腥了。"\r
    },\r

   "segments": [\r
    {\r
     "kind": "narration",\r
     "text": "五点半，闹钟还没响，[[NPC1]]自己就醒了。只睡了一个钟头，他反倒精神，嗓门大得把整栋宅子都叫醒。母亲{{e_pulaxida|普拉西达}}披着披肩跟进来，一边收拾一边念叨。"\r
    },\r
    {\r

    },\r

    },\r
    {\r

     "text": "他从枕头底下摸出那把从不离身的{{e_qiang|马格南手枪}}，退出子弹，一粒一粒摆在掌心看了看，又把枪收进床头柜的抽屉，和手表放在一处。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "speakerEntry": "e_pulaxida",\r
     "text": "（盯着那把枪）迎主教也带着这个？"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（满不在乎地摆手）今天不带。满镇都是喜事，带它做什么。"\r

     "slot": "NPC1",\r

    },\r

     "kind": "dialogue",\r

     "speakerEntry": "e_pulaxida",\r

   "segments": [\r
    {\r
     "kind": "narration",\r
     "text": "六点零五分，天刚亮透。[[NPC1]]难得地走了正门——这扇门平日总是闩死的，是家里老一辈定下的规矩，门闩得比钱柜还结实。只有迎贵客才开。今天主教来，算得上贵客。"\r
    },\r
    {\r

     "text": "门轴吱呀一声。晨光涌进门厅，也照亮了门槛内侧躺着的一只信封。那是一封{{e_jinggaoxin|警告信}}，没署名，字写得歪歪扭扭，边角叫夜里的潮气浸得发软：谁要杀他，在哪儿动手，为什么动手，全都写得明明白白。"\r

   "segments": [\r
    {\r
     "kind": "narration",\r
     "text": "六点过后，{{e_chuan|主教船}}还没见影子，河边已经挤满了人。乐队支起来了，背篓里的公鸡被鼓点惊得齐声打鸣，一声压过一声。小贩顶着箩筐在人群里钻，卖甘蔗酒，卖烤木薯，孩子们猴在树上，连平日最懒的狗都爬起来看热闹，专等汽笛响。"\r
    },\r
    {\r
     "kind": "narration",\r
     "text": "[[NPC1]]挤在最前排，白礼服扎眼得很。他昨夜闹到天快亮，这会儿却精神十足，正掰着手指头跟身边的人算昨夜的账。"\r
    },\r

     "kind": "dialogue",\r

     "text": "（眉飞色舞）四十只火鸡，十一头猪，还有堆成山的酒！你猜这一场得花多少？我跟你讲，够咱们全镇吃一年的！"\r
    },\r

     "text": "（一拍大腿）先学着！往后用得上。全镇上下，也就你肯听我唠叨这些鸡毛蒜皮。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC3",\r
     "text": "（提着裙摆挤过来，戳他胳膊）哎，昨夜是谁跳到后半夜，嗓门比乐队还响？我在河对岸都听见了！"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（得意）那是！高兴嘛！人一辈子，能赶上几场这样的婚礼？"\r
    },\r

     "kind": "dialogue",\r

     "text": "（拆台）高兴是高兴，就是不知道踩肿了几位姑娘的脚背。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（大笑）胡说八道！……回头你们都来，让你们看看什么叫排场。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "slot": "NPC2",\r
     "text": "听说主教是去省城，路过咱们这儿，停不停还两说。"\r

    {\r

     "slot": "NPC1",\r

     "text": "他一头冲进大宅，鞋都没停，直奔楼上卧室。厨娘{{e_weiduoli|维多利}}举着锅铲从厨房追出来。"\r

   "segments": [\r
    {\r
     "kind": "narration",\r
     "text": "五点半，天还没亮透。儿子{{e_nasa|纳萨}}端着水杯，倚在母亲卧室的门口，头发睡得乱翘。[[NPC1]]还歪在床上，人没起，耳朵先醒了。"\r

    },\r

     "text": "（闭着眼）讲。妈听着呢。你从小到大的梦，哪个不是妈给你解的。"\r
    },\r
    {\r
     "kind": "dialogue",\r
     "speakerEntry": "e_nasa",\r
     "text": "我梦见树了。老大的树，我一个人从树林子里穿过去，天上还飘着毛毛雨，细细的，落在脸上怪舒服的。"\r

     "kind": "dialogue",\r
     "speakerEntry": "e_nasa",\r
     "text": "那雨也怪，细得跟筛子筛过似的，打在树叶上沙沙响。我在林子里走啊走，怎么走都不累。"\r

    },\r

   "segments": [\r

     "text": "天刚亮透，两个人穿过还没醒透的镇子，敲开了[[NPC2]]的门。他们不跑，也不躲。进门第一件事，是把{{e_tudao|两把屠刀}}撂在桌上，血顺着刀背往下淌，滴在刚扫过的地上。狗看见他们，都夹着尾巴绕开了。沿街的人家从窗缝里往外看，没人出来，也没人喊。"\r

     "text": "（把刀往前一推）收好。人是我们杀的。从半夜磨刀那会儿起，全镇就听见我们喊了，我们不抵赖。"\r

     "text": "（声音很平）我们是存心要杀他的，但是我们无罪。"\r
    },\r
    {\r

     "slot": "NPC2",\r
     "text": "（盯着他们）无罪？一条人命躺在外面，你们管这叫无罪？"\r

     "slot": "NPC1",\r

     "text": "[[NPC2]]看着桌上那两把刀，半天说不出话。他听了一辈子忏悔，头一回见有人把杀人说得像领奖。窗外，镇子醒了，家家户户推开门张望，没人惊讶——大家惊讶的是，他们居然真的动了手。"\r

     "text": "人是在第二天凌晨下葬的，葬得草草。可这之前，还有一道手续躲不过去。当天下午，镇里传出话来：要验尸。{{e_yigulan|伊瓜兰}}医生偏偏外出看诊，三天后才能回来，全镇找不出第二个拿手术刀的人。差事最后落到了[[NPC1]]头上——一双拿惯了圣杯的手，被人请去拿起锯子。"\r

    },\r

     "kind": "dialogue",\r
     "slot": "NPC1",\r
     "text": "（把器械一样样摆开）锯子是给木头使的，剪子是给铁皮使的。今天它们要碰的，是我给做了二十年弥撒的人。"\r
    },\r

     "speaker": "校长",\r
     "text": "（递上一条干净毛巾）您就当……就当是替全镇办一件差事。报告上得有个人签字画押，除了您，没人压得住。"\r
