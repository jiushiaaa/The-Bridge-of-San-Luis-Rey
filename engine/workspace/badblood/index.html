   "1": [
    {
     "kind": "narration",
     "text": "第一卷 · 一滴血的梦"
    },
    {
     "kind": "narration",
     "text": "2006年11月17日，苏黎世。一家欧洲大药企的会议室里，百叶窗压了下来，一台烤箱大小的阅读器读完了那片加厚信用卡似的检测盒。屏幕上的曲线一条条跳出来，干净得像教科书插图。满座的人鼓掌。"
    },
    {
     "kind": "narration",
     "text": "没有人知道，那台阅读器当天上午黑过一次屏。九个时区之外的加州，有人被凌晨的电话叫醒，把几个月前跑出来的旧数据重新推上了那块屏幕。散场后，随行的员工给总部发回一封报喜邮件，转述老板的评语，只有三个字：太完美了。"
    },
    {
     "kind": "narration",
     "text": "第二天，公司的首席财务官敲开了 CEO 办公室的门。他管着每一份交到投资人手里的材料，前一夜终于想明白那些「实时结果」是怎么来的。话讲完，办公室静了几秒。当天下午，他被请出大门，再没有回来。"
    },
    {
     "kind": "narration",
     "text": "故事要从更早说起。1984年，华盛顿特区一户体面人家添了个女儿。祖上办过一家红火几十年的酵母公司，家业说没就没了，父亲总在饭桌上把这段家史再讲一遍，讲完叹一口气。"
    },
    {
     "kind": "narration",
     "text": "九岁那年，亲戚逗她：长大想做什么呀？她说，我要做亿万富翁。亲戚又笑：那想不想嫁给总统？满屋子等着听一句童言，她却摇头——总统将会娶她，因为她会拥有十亿美元。"
    },
    {
     "kind": "narration",
     "text": "2003年非典那年，她在新加坡的实验室里天天经手病人样本。回程的飞机上她想通一件事：诊断和吃药，为什么要分开？返校后熬了几个通宵，一份几十页的专利申请写成了——一片绑在手臂上的布，埋着比头发还细的针，一边取血，一边把药送回去。医学院的一位教授告诉她这行不通；化学工程系的导师却在推荐信里把她比作另一个盖茨、另一个乔布斯。"
    },
    {
     "kind": "narration",
     "text": "那年冬天她退了学。2004年夏天，硅谷101号公路「错误的一侧」，一栋旧楼的二层挂出一块没人听说过的新牌子。隔壁是机修厂，空气里有机油味，房租便宜得不像话。二手桌椅之间，烤箱大小的样机摆在过道上，一块镇纸压着一行字：如果知道自己绝不会失败，会做什么？"
    }
   ],
   "2": [
    {
     "kind": "narration",
     "text": "第二卷 · 独角兽"
    },

       "kind": "narration",
       "text": "故事要从华盛顿说起。1984年，一个女孩出生在一个败落的家庭：祖辈的酵母公司红火几十年，说没就没了，父亲总在饭桌上讲这段家史。九岁那年，亲戚逗她长大想做什么，她说要做亿万富翁；又笑问她想不想嫁给总统。满屋子大人笑成一团，只有她没笑。"

       "text": "不，总统将会娶我，因为我会拥有10亿美元。"

       "text": "这个女孩叫霍姆斯。她考进斯坦福化学工程系，2003年非典期间去新加坡的基因组研究院实习，给病人样本做检测。回国的飞机上她想通一件事：诊断和吃药为什么要分开？返校后她写出一份几十页的专利申请：一条绑在手臂上的布带，微针采血，边诊断边给药，取名诊疗贴片，随后办了辍学。"

       "kind": "narration",
       "text": "2006年11月17日，公司在瑞士给一家欧洲大药企做了成立以来最重要的一场演示。屏幕上的数据漂亮得像教科书，随行邮件报喜，说对方的评价只有三个字——太完美了。只有首席财务官莫斯利笑不出来：他从沙奈克口中得知，投资人看到的「实时结果」是提前录制的回放；当天上午一台阅读器黑屏，是加州的生物信息主管坎普连夜把旧数据重新推上了屏幕。第二天，莫斯利敲开了她办公室的门。"

     "segments": [
      {
       "kind": "narration",
       "text": "为了拿到活证据，卡雷鲁飞往亚利桑那。那家公司的四十多家健康中心，就藏在这座沙漠城市周边的连锁药店里。家庭女医生桑德内手里攒着十几份可疑结果，按日期排好：数值和症状完全对不上，让病人去别的实验室重查，十次里有八次是正常的。"
      },
      {
       "kind": "narration",
       "text": "病人的遭遇各有各的惊心。格伦兹把急诊收费单、两份验血报告和一张手写的时间表按日期排好，收在文件夹第一页；她不要钱，只想问一句：一台连我有没有病都说不准的机器，凭什么摆在药店里让人排队去用？执业多年的斯图尔特医生则告诉他：一位病人的报告提示深静脉血栓，差点被送进昂贵又有风险的复查；另一位孕妇的甲状腺指标出错，如果不是她按住药量，伤的就是两条命。"
      },
      {
       "kind": "narration",
       "text": "离开前，卡雷鲁决定亲身验证。他和桑德内各自伸出手指：同一个人的血样，一半送去健康中心，一半送去老牌大实验室。几天后报告到手，同一批指标多项对不上，钾的数值尤其刺眼。他把两份报告并排钉进笔记本，拍照，云端备份：这不再是传闻，这是钉在纸上的证据。"
      },
      {
       "kind": "narration",
       "text": "前主管比姆的决心，早在一年前的万圣节派对上就点着了：人人都在笑，他端着啤酒站在角落，一遍遍想同一个问题——哪天出了医疗事故，法官问「签字的人知情吗」，我答什么？那天晚上回家，他就把辞职信打了出来。"
      },
      {
       "kind": "narration",
       "text": "公司已经查到了记者的身边。2015年5月27日，泰勒被叫回祖父家——他写给女创始人的长邮件里，一个变异系数的数字露了馅。客厅里，年过九旬的舒尔茨刚盘问过孙子有没有跟报社接触，楼梯上就下来两名西装律师：他们一直等在楼上。一份临时限制令拍在茶几上，外加一封起诉威胁函。"
      },
      {
       "kind": "quote",
       "entry": "e_tyler",
       "text": "我不会签。我写的每一个数字，都是实验室里真实测出来的。"
      },
      {
       "kind": "narration",
       "text": "九旬老人勃然大怒，起身把两位大律师轰出家门。可这挡不住第二天的第二波攻势：律师带着一份更苛刻的「宣誓书」卷土重来，不仅要他承认造谣，还要供出其他信源的名字。走出祖父家时，泰勒发现自己的手一直在抖。"
      }
     ]

    {
     "rows": [
      4,
      5
     ],
     "title": "商业秘密与拉马坦萨",
     "cards": [
      "c3_05",

     "segments": [
      {
       "kind": "narration",
       "text": "6月23日，对方直接找上了报社的门。领队的是全国最负盛名的诉讼律师博伊斯，随行的有法律总顾问、律所干将、技术博士丹尼尔和公关的人。会议室里，卡雷鲁和同事把一台录音机推到桌子中央。"
      },
      {
       "kind": "quote",
       "entry": "e_carreyrou",
       "text": "我们不同意放弃我们的新闻特权。"
      },
      {
       "kind": "narration",
       "text": "四小时的会谈是一场心理战。对方的开场白是「我们不同意你们发表我们的商业秘密」；忽然话锋一转，当面点破关键信源的名字，想打乱阵脚——卡雷鲁一个字也没接。轮到技术问题，丹尼尔把太极推到极致：跑了多少检测，商业秘密；稀释几倍，还是商业秘密；谈到已故的首席科学家，对方暗示他酗酒。尾声时，老律师终于失去耐心，一掌拍在桌上。"
      },
      {
       "kind": "quote",
       "entry": "e_boies",
       "text": "它要不是魔法，就是一项新技术！"
      },
      {
       "kind": "narration",
       "text": "施压不止在会议室里。辞职半年的比姆收到律所的信，要他签声明否认向记者透露过公司事务。他没签，继续做不署名的信源。艾瑞卡在新公司的停车场被陌生男人拦住，塞给她一封信：信封上的地址，是她刚搬进去、连朋友都不知道的临时住所。她当晚报了警。"
      },
      {
       "kind": "narration",
       "text": "泰勒那边，仗打得更久。伏击第二天，律师带着「宣誓书」再次登门：签字、认错、供出同路人，两年内不起诉；祖父拿起笔，把「两年」划掉，改成「永远」，推了回去——年轻人还是拒签。威胁如约而至：不签，就拖到你家族倾家荡产。几个月周旋下来，父母花掉四十多万美元——老两口半辈子的积蓄，他也从记者视野里消失了。"
      },
      {
       "kind": "narration",
       "text": "那个夏天，贵宾演示却一场比一场隆重。流程永远一样：女掌门亲自站台，样本进机，大屏幕的进度条缓缓爬升——会停在70%的进度条，本来就是工程师受命写的掩盖程序；客人看品牌墙的间隙，样本从后门取走，送到另一层楼的商用分析仪上跑。最隆重的一次，一位副总统到访：工厂连夜搭出一间「自动化实验室」，真实验室已七个月无人执掌。副总统对着镜头称赞，说这里是「未来的实验室」。"
      },
      {
       "kind": "narration",
       "text": "编辑室里，主编西克诺尔菲管这套打法叫拉马坦萨——西西里渔民围捕鱼群的仪式：先把网收紧，再等鱼自己乱掉。记者要做的只有一件事：逐条核实，无懈可击。"
      }
     ]

     "segments": [
      {
       "kind": "narration",
       "text": "从春天到秋天，霍姆斯三次登门求见传媒大亨默多克——最大的个人投资人。她的说辞每次都一样：报道是「精致的幻想」，见了报会血本无归；老人的回答也都一样。"
      },
      {
       "kind": "quote",
       "entry": "e_murdoch",
       "text": "我买下这家报纸，就是因为它的编辑说了算。"
      },
      {
       "kind": "narration",
       "text": "2015年10月15日，《一家被看好的创业公司的挣扎》上了头版：机器不管用、样本稀释、商用设备冒充专有技术。同一天，药监局宣布那支小采血管是「未经许可的医疗设备」。风暴当天，她对着镜头念台词：「首先他们觉得你疯了……突然之间，你改变了世界。」员工大会上，几百人齐喊：「去你妈的，卡雷–鲁！」"
      },
      {
       "kind": "narration",
       "text": "凤凰城的格伦兹，是在便利店报架上读到报道的。读到最后——最后一段引的是她的话：拿活人一遍遍试，这不行。公司声明说整篇报道是「精致的幻想」；有人打电话让她「再想想是不是记错了」，她说，我的账单还在冰箱上贴着。后来，沙漠城市里四十多个抽血点一个个关掉；作废和纠正的结果加起来快一百万份。"
      },
      {
       "kind": "narration",
       "text": "掀开屋顶的，是一封一页纸的投诉信。9月19日，前实验员艾瑞卡把实验室里亲见的一切写给资深巡视员山本：质控连续失败、无执照人员删「极端值」、能力验证只用商用设备应考——每一条她都愿意署名作证。老巡视员三年前就被一句「设备仍在开发」挡在门外，这回只回四个字：我们马上来。三天后检查队伍开进工厂，两个月后又驻扎四天。"
      },
      {
       "kind": "narration",
       "text": "随后公开的检查报告长达一百二十一页：宣称的两百五十项检测，只有十二项在自家机器上做；一个月里三分之一的质控不过；两边结果偏差最高达百分之一百四十六。监管机构亮出最重的牌：禁止掌门人从事实验室行业两年。连锁药店宣布终止合作，关掉所有健康中心。"
      },
      {
       "kind": "quote",
       "entry": "e_erika",
       "text": "我当时只是想，不能让病人用坏的结果。"
      },
      {
       "kind": "narration",
       "text": "不肯签字的年轻人，等来了他的法庭。2017年的取证会上，被扫地出门的桑尼出现在走廊里，死死盯住泰勒。他没有躲开那道目光：伏击、宣誓书、倾家荡产的威胁、四十多万的律师费，全都扛过来了——说真话的人不需要背台词。官司以四千三百万美元和解。"
      }
     ]
    },
    {

     "title": "演了十五年，终究没有成真",
     "cards": [
      "c3_09",

     "segments": [
      {
       "kind": "narration",
       "text": "2016年8月，费城的学术年会座无虚席。一身黑色高领衫的女创始人站上讲台，发布那台被许诺了五年的新机器。可台下的科学家不是投资人，提问环节变成围猎——所谓检测数据，大部分来自传统静脉抽血。散场时，人流里有人喊了一声：你伤害了人！她没有回头。"
      },
      {
       "kind": "narration",
       "text": "清算早已开始。这一年5月，她与并肩七年的桑尼分手，同时把他赶出公司。2018年3月，证券监管机构指控：「精心策划、持续多年的欺诈」；三个月后，刑事起诉书送达：两项串谋、九项诈骗。那年9月，公司资金耗尽解散，投资者损失约十亿美元。记者卡雷鲁的结论写在书的结尾：她不是任何人的傀儡——99.7%的投票权一直在她手里；真正的操控者，从来都是她自己。"
      },
      {
       "kind": "narration",
       "text": "风暴的另一头，当年被跟踪、被恐吓的艾瑞卡换了一座城市，重新读书。偶尔在新闻里看到那家公司的名字，后面的数字一样样归零。"
      },
      {
       "kind": "quote",
       "entry": "e_erika",
       "text": "我们当时只是想——不能让病人用坏的结果。"
      }
     ]
    }
   ]
  }
 }
