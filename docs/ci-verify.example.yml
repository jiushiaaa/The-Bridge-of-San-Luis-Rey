name: Verify full game
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: engine/frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm --prefix engine/frontend ci
      - run: npm run check:release
      - uses: actions/upload-artifact@v4
        with:
          name: san-luis-rey-web
          path: dist/
          retention-days: 14
